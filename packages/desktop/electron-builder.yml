appId: com.vibisual.app
productName: Vibisual
copyright: Copyright © 2026 길근오

directories:
  output: dist
  buildResources: resources

# electron-vite emits the bundled main/preload/renderer into out/.
files:
  - out/**
  - package.json
# electron-builder's default file walk + pnpm symlinks don't reliably copy the
# server's dist + node_modules into the package (.gitignore excludes dist; pnpm
# symlinks confuse the walker). Instead an afterPack hook copies real files
# (symlinks dereferenced) into the packaged tree after electron-builder finishes
# its standard work.
afterPack: ./build/after-pack.cjs

# 우리 자신의 라이선스·고지를 설치본에 함께 보낸다.
# 의존성 LICENSE 는 afterPack 이 node_modules 를 실물 복사하며 277개가 따라 들어가는데,
# 정작 Vibisual 자신의 Apache-2.0 전문과 NOTICE(상표 조항 포함)만 빠져 있었다 — 설치본을
# 받은 사람이 우리 코드의 라이선스를 확인할 방법이 없다는 뜻이라 재배포 조건이 성립하지 않는다.
# `resources/LICENSE` · `resources/NOTICE` 로 앉는다(Electron 자신의 LICENSE.electron.txt 와 같은 층).
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE

# Disable asar packaging entirely. The pnpm symlink layout doesn't play well
# with electron-builder's asarUnpack matching — better_sqlite3.node ended up
# inside the asar (dlopen unfriendly) and sqlite-vec's platform DLL was
# missing. With asar:false everything ships as plain files and the child Node
# process can dlopen natives directly. Trade-off: marginally larger install
# footprint, easier-to-inspect app code. Acceptable for current scope.
asar: false

# Skip electron-builder's default native rebuild (we control it explicitly via
# @electron/rebuild — npmRebuild would try to use node-gyp against the system
# Node version, which is exactly the ABI mismatch we're avoiding).
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  # signAndEditExecutable=false disables both signing AND rcedit (icon embed). We
  # turn it off because enabling it triggers a winCodeSign cache download whose 7z
  # contains macOS symlinks — those fail to extract on Windows without Developer
  # Mode / admin. Instead, after-pack.cjs invokes rcedit directly to embed the
  # brand bubble icon into Vibisual.exe, bypassing the cache download entirely.
  signAndEditExecutable: false
  # Code signing slot — certificate wiring is deferred (SCENARIO.md §3.7 / task §7).
  # certificateFile / certificatePassword left unset on purpose.

nsis:
  # §4 v2.44 — 자동 업데이트가 무인(조용히)으로 돌려면 oneClick 인스톨러가 필요하다.
  # oneClick:false(조립형 마법사)는 자동 업데이트의 "기존 파일 제거" 단계에서
  # "Failed to uninstall old application files (2)" 류 에러 + 마법사 노출이 잦다.
  # oneClick:true + perMachine:false = per-user 무인 설치/업데이트(관리자 권한 불필요).
  oneClick: true
  perMachine: false
  # allowToChangeInstallationDirectory 는 oneClick:false 에서만 유효 — 제거.
  artifactName: ${productName}-${version}-setup.${ext}
  # Brand bubble — installer wizard window, uninstaller, and Start-menu/Desktop shortcuts
  # all use the multi-size .ico so Windows renders crisp at every DPI.
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico

mac:
  # ⚠️ 여기에 `arch:` 를 못 박지 마라. 못 박으면 electron-builder 의 arch 계산
  # (computeArchToTargetNamesMap)이 **CLI 의 `--arm64`/`--x64` 보다 이 목록을 우선**해서,
  # 아키텍처를 갈라 지으려고 러너를 나눠도 두 잡이 똑같이 두 아키텍처를 다 뽑는다.
  # 비워 두면 CLI 플래그(릴리스) 또는 호스트 아키텍처(로컬 `dist:mac`)를 따른다 —
  # 그래야 각 dmg 가 **그 아키텍처에서 설치된 네이티브 모듈**과 짝이 맞는다
  # (.github/workflows/release.yml 머리말의 koffi 항목 참고).
  target:
    # ⚠️ `zip` 을 빼지 마라 — dmg 만 두면 자동 업데이트가 조용히 죽는다.
    # Squirrel.Mac(= electron-updater 의 macOS 백엔드)은 zip 으로만 업데이트를 적용하고,
    # electron-builder 는 zip 타깃이 있어야 `latest-mac.yml`(업데이트 피드)을 만든다.
    # 이게 없으면 코드서명을 나중에 붙여도 `checkForUpdates()` 는 계속 실패한다
    # (2026-08-26 조사 — mac 자동 업데이트가 막힌 원인은 서명 미배선 + 이 항목 두 겹이었다).
    - dmg
    - zip
  # Point at a finished .icns rather than letting electron-builder derive one from
  # icon.png. Its converter (app-builder, Go) panics with "index out of range [-1]"
  # in icons.doConvertIcon on that path — an upstream bug open since 2018, and the
  # second thing that blocked mac releases after the 512×512 size check. The .icns
  # is generated alongside icon.png/.ico by resources/icons/generate-placeholder.mjs,
  # so regenerate all three together.
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools

# deb/rpm 은 **homepage 가 없으면 포장 단계에서 죽는다**(fpm 의 --url).
# 이 값은 루트 package.json 에만 있는데 electron-builder 는 앱 디렉터리(packages/desktop)의
# package.json 만 본다. 리눅스 사정으로 앱 package.json 을 고치는 대신 여기서 얹는다.
extraMetadata:
  homepage: https://github.com/Vibisual/vibisual

# ⚠️ deb·rpm 타깃은 이 파일에 뒤늦게 들어왔고(커밋 a22a0ea) **아직 한 번도 발행된 적이 없다** —
#    v0.1.14 자산은 AppImage 뿐이다. 실제로 지어 보니 아래 maintainer/artifactName/homepage
#    세 값이 없어 포장 단계에서 죽었다(2026-08-29 WSL Ubuntu 실측). 셋 다 여기서 못 박아 둔다.
linux:
  # ⚠️ AppImage 만으로는 **받아서 그냥 실행할 수 없다.** AppImage type2 는 `libfuse.so.2` 를
  # dlopen 하는데 요즘 배포판에는 FUSE 3 만 있다 — Ubuntu 24.04 러너 실측으로
  # `dlopen(): error loading libfuse.so.2` 즉사를 확인했다(2026-08-28 smoke run #7).
  # 사용자 눈에는 "받았는데 안 켜진다"이고, 해결책이 "libfuse2 를 apt 로 까세요"라면
  # 그건 해결이 아니다. **deb/rpm 은 의존성을 패키지 매니저가 알아서 끌어온다** —
  # 포장을 바꾸는 것이 안내문을 쓰는 것보다 낫다. AppImage 는 그 둘이 안 통하는
  # 배포판(Arch·NixOS 등)을 위해 남겨 둔다.
  target:
    - AppImage
    - deb
    - rpm
  # ⚠️ 이 줄이 없으면 실행 파일이 `@vibisualdesktop` 이 된다 —
  # `LinuxPackager` 가 `appInfo.sanitizedName.toLowerCase()` 로 떨어뜨리는데
  # 그게 package.json 의 `@vibisual/desktop` 에서 나온다(실측: AppRun 이 `/@vibisualdesktop` 를 부른다).
  # `@` 로 시작하는 이름은 셸에서 다루기 나쁘고 **deb 패키지 이름으로는 아예 불법**이다.
  # 🔒 이것은 실행 파일·.desktop 항목의 이름만 바꾼다 — `app.getPath('userData')` 는
  #    `app.getName()`(= package.json 의 name)에서 나오므로 **설정·토큰 경로는 그대로다.**
  executableName: vibisual
  icon: resources/icons/icon.png
  category: Development
  synopsis: Visual development environment for AI coding agents
  description: |
    Vibisual turns Claude Code hook events into a live bubble map so you can
    watch your AI agents think, spawn, and finish work in real time.
  desktop:
    StartupWMClass: Vibisual

# deb/rpm 공통 — 패키지 이름은 **소문자 영숫자**여야 한다.
# electron-builder 의 `linuxPackageName` 은 `@` 로 시작하는 name 을 productName 으로 대체하는데
# 그 값이 `Vibisual`(대문자 V)이라 dpkg 규칙(`^[a-z0-9][a-z0-9+.-]+$`)에 걸린다. 그래서 못 박는다.
deb:
  packageName: vibisual
  # ⚠️ maintainer 가 없으면 포장이 죽는다 — package.json 의 author 가 이메일 없는 문자열이라
  #    electron-builder 가 Debian 규격의 "이름 <메일>" 을 만들지 못한다. 여기서 못 박는다.
  #    (개인 주소가 아니라 프로젝트 주소를 쓴다 — 모든 deb 의 control 에 공개로 박힌다.)
  maintainer: Vibisual <noreply@vibisual.pro>
  # ⚠️ 기본 artifactName 은 `${name}` = npm 이름(@vibisual/desktop)이라 슬래시가 경로로 해석돼
  #    `dist/@vibisual/desktop_0.1.14_amd64.deb` 를 쓰려다 "Parent directory does not exist" 로
  #    죽는다. Debian 관례대로 packageName 을 쓴다.
  artifactName: vibisual_${version}_${arch}.${ext}
  # `depends` 는 **일부러 비워 둔다.** 손으로 적으면 Ubuntu 24.04 의 t64 전환
  # (`libgtk-3-0` → `libgtk-3-0t64`) 같은 배포판별 이름 차이를 우리가 떠안게 된다.
  # electron-builder 기본값이 실제로 통하는지는 스모크가 `apt install ./*.deb` 로 잰다 —
  # 추측하지 말고 재는 자리를 만들어 두는 편이 낫다.

# rpm 은 **rpmbuild 가 있어야** 지어진다(fpm 이 부른다). release.yml 의 ubuntu-latest 러너에는
# rpm 4.18 이 기본으로 깔려 있어 그대로 통하고, 손으로 지을 때만 `sudo apt install rpm` 이 필요하다.
rpm:
  packageName: vibisual
  # deb 와 같은 이유(위 주석 참고). rpm 관례는 `이름-버전.아키.rpm`.
  maintainer: Vibisual <noreply@vibisual.pro>
  artifactName: vibisual-${version}.${arch}.${ext}

# electron-updater feed — SCENARIO.md §4 v2.44 자동 업데이트.
# 이 publish 설정이 있어야 electron-builder 가 빌드 산출물에 app-update.yml 을 베이킹하고,
# `--publish always` 빌드 시 setup + latest.yml(+blockmap)을 GitHub Releases 에 업로드한다.
# main 의 updaterManager(autoUpdater)는 이 피드를 읽어 최신 버전을 감지·다운로드한다.
# ⚠️ 소스 main 푸시 ≠ 릴리스 — 버전 bump + 릴리스 발행(.github/workflows/release.yml)이 있어야
#    업데이트가 트리거된다.
publish:
  provider: github
  owner: Vibisual
  repo: vibisual
  # electron-builder 기본값은 draft(초안) — 업데이터(autoUpdater)는 draft 릴리스를 읽지 못한다.
  # release 로 두어야 태그 푸시 시 정식 발행되어 설치된 앱이 latest.yml 을 감지한다.
  releaseType: release
