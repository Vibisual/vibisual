appId: com.vibisual.app
productName: Vibisual
copyright: Copyright © 2026 길근오

directories:
  output: dist
  buildResources: resources

# electron-vite emits the bundled main/preload/renderer into out/.
files:
  - out/**
  - package.json
# electron-builder's file walk doesn't reliably copy the server's dist + node_modules (.gitignore excludes dist;
# pnpm symlinks confuse the walker), so an afterPack hook copies real files (symlinks dereferenced) into the package.
afterPack: ./build/after-pack.cjs

# 우리 자신의 라이선스·고지·약관을 설치본에 보낸다 — Apache-2.0 전문과 NOTICE(상표 조항)가 없으면 재배포 조건이 성립하지 않는다.
# `resources/LICENSE` · `resources/NOTICE` 로 앉는다(Electron 의 LICENSE.electron.txt 와 같은 층). EULA 는 배포 설치본의 별도 조건
# (재배포·재포장 금지, 상표, 무보증)이고 EULA §5 가 이 경로를 가리키므로 셋은 한 덩어리로 움직인다. 설치 중 동의는 아래 nsis 절.
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../EULA.md
    to: EULA.md
  - from: ../../PRIVACY.md
    to: PRIVACY.md
  - from: build/license
    to: legal

# No asar — with the pnpm symlink layout, asarUnpack matching left better_sqlite3.node inside the asar (dlopen
# unfriendly) and dropped sqlite-vec's platform DLL. Plain files let the child Node process dlopen natives directly.
asar: false

# Skip electron-builder's native rebuild — we run @electron/rebuild ourselves; npmRebuild would node-gyp against the system Node (ABI mismatch).
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  # false disables signing AND rcedit — enabling it downloads a winCodeSign 7z whose macOS symlinks fail to extract
  # on Windows without Developer Mode / admin. after-pack.cjs runs rcedit directly to embed the icon instead.
  signAndEditExecutable: false
  # Code signing slot (SCENARIO.md §3.7) — certificateFile / certificatePassword left unset on purpose.

nsis:
  # §4 — 자동 업데이트가 무인으로 돌려면 oneClick 이어야 한다(oneClick:false 는 "Failed to uninstall old application files (2)"
  # + 마법사 노출이 잦다). perMachine:false = per-user 설치(관리자 권한 불필요).
  oneClick: true
  perMachine: false
  # 새 설치에서 설치 프로그램이 가끔 0xC0000005 로 죽는 electron-builder 24 템플릿 결함을 비껴간다.
  # 까닭·방법은 그 파일 머리말. 지우면 Windows 스모크가 다시 가끔 빨개진다(23회 중 6회였다).
  include: build/installer.nsh
  # 설치 언어 고르기 → 사용권 계약 동의(build/installer.nsh 의 licensePage). oneClick 이어도 oneClick.nsh 가 그 매크로를 넣는다.
  # 언어 창은 /S 면 안 뜨고 동의 화면은 --updated 면 건너뛰어 자동 업데이트는 조용하다.
  # ⚠️ 약관 파일을 resources/(buildResources)에 license_*.txt 로 두지 마라 — dmg 에도 동의 창이 붙어 맥 자체 업데이트가 멈춘다.
  displayLanguageSelector: true
  # 앱 UI 로케일 중 NSIS 가 아는 것. installer.nsh 의 LicenseLangString 과 한 몸이다 — 여기만 늘리면 -WX 로 빌드가 멈춘다.
  # 맨 앞이 기본 언어(OS 언어가 목록에 없으면 English). es-419 는 따로 없다 — OS 가 es-MX 등이면 NSIS 가 Spanish 를 고른다.
  installerLanguages:
    - en_US
    - ko_KR
    - ja_JP
    - zh_CN
    - de_DE
    - fr_FR
    - es_ES
    - pt_BR
    - it_IT
    - id_ID
    - hi_IN
  # allowToChangeInstallationDirectory 는 oneClick:false 에서만 유효하다.
  artifactName: ${productName}-${version}-setup.${ext}
  # Multi-size .ico for installer, uninstaller and shortcuts — crisp at every DPI.
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico

mac:
  # ⚠️ 여기에 `arch:` 를 못 박지 마라 — computeArchToTargetNamesMap 이 CLI 의 `--arm64`/`--x64` 보다 이 목록을 우선해
  # 러너를 나눠도 두 잡이 두 아키텍처를 다 뽑는다. 비워 두면 CLI 플래그나 호스트 아키텍처를 따라 그 아키텍처에서 설치된
  # 네이티브 모듈과 짝이 맞는다(.github/workflows/release.yml 머리말의 koffi 항목).
  target:
    # ⚠️ `zip` 을 빼지 마라 — Squirrel.Mac 은 zip 으로만 업데이트를 적용하고 electron-builder 는 zip 이 있어야
    # `latest-mac.yml` 을 만든다. 없으면 서명을 붙여도 `checkForUpdates()` 가 계속 실패한다.
    - dmg
    - zip
  # A finished .icns — deriving one from icon.png panics app-builder ("index out of range [-1]" in icons.doConvertIcon,
  # upstream since 2018). resources/icons/generate-placeholder.mjs makes .icns/.png/.ico together — regenerate all three.
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  # §5.5 #17-38 — 마이크 사용 문구. 이 키가 없으면 macOS 가 첫 `getUserMedia({audio})` 에서 앱을 SIGABRT 로 죽인다(TCC).
  # 권한 창에 그대로 보이므로 언제·왜 쓰는지를 적는다.
  extendInfo:
    NSMicrophoneUsageDescription: Vibisual uses the microphone only while voice input is switched on, to turn what you say into text in the command box. Nothing is recorded or stored.

# deb/rpm 은 homepage 가 없으면 포장에서 죽는다(fpm --url) — electron-builder 는 packages/desktop 의 package.json 만 봐 여기서 얹는다.
extraMetadata:
  homepage: https://github.com/Vibisual/vibisual

# ⚠️ deb·rpm 은 maintainer · artifactName · homepage 가 없으면 포장 단계에서 죽는다(2026-08-29 WSL Ubuntu 실측) — 셋 다 여기서 못 박는다.
linux:
  # ⚠️ AppImage 만으로는 받아서 그냥 실행할 수 없다 — type2 는 `libfuse.so.2` 를 dlopen 하는데 요즘 배포판엔 FUSE 3 만 있다
  # (2026-08-28 Ubuntu 24.04 러너 실측: `dlopen(): error loading libfuse.so.2`). deb/rpm 은 의존성을 패키지 매니저가 끌어온다.
  # AppImage 는 deb/rpm 이 안 통하는 배포판(Arch·NixOS 등)용이다.
  target:
    - AppImage
    - deb
    - rpm
  # ⚠️ 없으면 실행 파일이 `@vibisualdesktop` 이 된다(`LinuxPackager` 가 package.json 의 `@vibisual/desktop` 에서 떨어뜨린다) —
  # `@` 시작 이름은 셸에서 다루기 나쁘고 deb 패키지 이름으로는 불법이다. 실행 파일·.desktop 이름만 바뀌고
  # `app.getPath('userData')`(= package.json name)는 그대로다.
  executableName: vibisual
  icon: resources/icons/icon.png
  category: Development
  synopsis: Visual development environment for AI coding agents
  description: |
    Vibisual turns Claude Code hook events into a live bubble map so you can
    watch your AI agents think, spawn, and finish work in real time.
  desktop:
    StartupWMClass: Vibisual

# 패키지 이름은 소문자여야 한다 — 기본값은 productName `Vibisual` 이라 dpkg 규칙(`^[a-z0-9][a-z0-9+.-]+$`)에 걸린다.
deb:
  packageName: vibisual
  # maintainer 가 없으면 포장이 죽는다(author 에 이메일이 없다). 개인 주소가 아니라 프로젝트 주소 — 모든 deb 의 control 에 공개로 박힌다.
  maintainer: Vibisual <noreply@vibisual.pro>
  # 기본 artifactName 은 npm 이름(@vibisual/desktop)의 슬래시가 경로가 돼 "Parent directory does not exist" 로 죽는다.
  artifactName: vibisual_${version}_${arch}.${ext}
  # electron-builder 24 기본 의존성은 ALSA를 빠뜨려 깨끗한 Ubuntu에서 libasound.so.2 로더 오류가 났다.
  # depends는 기본값을 대체하므로 기존 9종도 모두 유지한다. ALSA의 t64 전환 전후 이름을 함께 받는다.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2

# rpm 은 rpmbuild 가 있어야 지어진다(fpm 이 부른다) — 손으로 지을 때는 `sudo apt install rpm`.
rpm:
  packageName: vibisual
  # deb 와 같은 이유(위 주석 참고). rpm 관례는 `이름-버전.아키.rpm`.
  maintainer: Vibisual <noreply@vibisual.pro>
  artifactName: vibisual-${version}.${arch}.${ext}
  # electron-builder 24 기본 Requires 8종을 보존하고 Electron의 직접 링크 대상인 ALSA를 선언한다.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - alsa-lib

# electron-updater 피드(SCENARIO.md §4) — 이 설정이 있어야 app-update.yml 이 베이킹되고 `--publish always` 가 GitHub Releases 에
# 올린다. main 의 updaterManager 가 이 피드를 읽는다. main 푸시 ≠ 릴리스 — 버전 bump + 태그(.github/workflows/release.yml).
publish:
  provider: github
  owner: Vibisual
  repo: vibisual
  # ⚠️ draft 로 올린다 — 업데이터는 draft 를 읽지 못하므로, `smoke.yml` 이 draft 자산을 실제로 설치·실행해 통과시킨 뒤에야
  # 그 `publish` 잡이 공개한다. `release` 로 되돌리면 깨진 설치본이 검증 전에 사용자에게 닿는다(`releasePackaging.test.ts` 가 막는다).
  releaseType: draft
