<!doctype html>
<!-- lang 은 부팅 기본값(shared `DEFAULT_UI_LOCALE`)이고, 이후 UI 언어를 따라 i18n 이 갱신한다
     (§5.5 #17-22 ⑤-3 — CSS `:lang()` 문자 폴백 차례 · 크로미움 글꼴 폴백 · 스크린리더가 읽는 값).
     여기 값을 손으로 바꾸지 말 것: 종전에 `ko` 가 박혀 있어 기본 로케일(en)과 어긋나 있었다. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- §4 v3.16 모바일 웹 접속 — maximum-scale=1 로 iOS 의 입력 포커스 자동 확대(레이아웃 붕괴 원인) 차단.
         페이지 줌 대신 버블 캔버스 자체 핀치줌 사용. 데스크톱(Electron)엔 영향 없음.
         `viewport-fit=cover` 는 쓰지 않는다 — 안전 영역(env(safe-area-inset-*)) 처리가 없어 노치 쪽 손잡이와 홈 표시줄 위
         바닥 시트·입력창이 가려졌다. 기본값(auto)이면 iOS 가 안전 영역 안에 그리고 바깥은 body 바탕색으로 채운다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Vibisual</title>
  </head>
  <body class="bg-gray-950 text-white">
    <!-- §3.7 — 첫 화면에도 제목줄. React 가 헤더를 그리기 전에도 창을 잡아 옮길 수 있게 36px 드래그 띠를
         깐다(VS Code 가 첫 화면에 제목줄을 까는 것과 같다). 첫 렌더가 #root 안을 비우며 이 띠를 지운다. -->
    <div id="root"><div class="app-drag h-9" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
