# 배포 채널(winget · Homebrew tap)에 새 판올림을 올린다.
# ⚠️ 릴리스 자산을 내려받지 않는다 — sha256 은 릴리스 잡이 발행한 `SHA256SUMS.txt` 에서 읽는다(설치 수 집계에 안 잡힌다).
#    `winget-releaser` 액션은 해시를 구하려 설치본을 받아 다운로드 수를 오염시키므로 쓰지 않고 직접 PR 을 연다.
# ⚠️ 시크릿이 없으면 아무 데도 안 보내고 매니페스트만 아티팩트로 남긴다 — 토큰을 넣는 것이 곧 보내도 된다는 승인이다.

name: Packaging

on:
  # 스모크가 draft 를 풀어 공개된 뒤에 돈다 — draft 의 URL 은 아직 아무도 받을 수 없다.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '매니페스트를 지을 태그 (비우면 최신 공개 릴리스)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    # ⚠️ 시크릿을 잡 수준에 둔다 — 스텝의 `if:` 는 그 스텝 자신의 env 를 못 봐, 스텝에 두면 아무 데도 안 보내고 조용히 초록이 된다.
    env:
      WINGET_FORK_TOKEN: ${{ secrets.WINGET_FORK_TOKEN }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 태그 확정
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts \
                    --json tagName -q '.[0].tagName')
          fi
          echo "대상: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: 매니페스트 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-packaging-manifests.mjs "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: packaging-manifests-${{ env.VERSION }}
          path: packaging/generated
          retention-days: 30

      # winget — `microsoft/winget-pkgs` 의 우리 포크에 브랜치를 밀고 PR 을 연다(`WINGET_FORK_TOKEN`: 포크 쓰기 · PR 생성).
      - name: winget PR
        if: env.WINGET_FORK_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.WINGET_FORK_TOKEN }}
          FORK: ${{ vars.WINGET_FORK || 'Vibisual/winget-pkgs' }}
        run: |
          set -euo pipefail
          DEST="manifests/v/Vibisual/Vibisual/$VERSION"
          # 포크를 상류에 맞춘다(서버 fast-forward). 갈라져 실패해도 PR 은 열 수 있어 막지 않는다.
          gh repo sync "$FORK" --source microsoft/winget-pkgs --branch master || true
          # ⚠️ 통째로 클론하지 마라 — 매니페스트 수십만 개라 러너 디스크·시간을 먹는다. 블롭 없이 받아 우리 폴더만 편다.
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${WINGET_FORK_TOKEN}@github.com/${FORK}.git" fork
          cd fork
          git sparse-checkout set --no-cone "manifests/v/Vibisual"
          git config user.name  "vibisual-bot"
          git config user.email "noreply@vibisual.pro"
          git checkout -b "vibisual-$VERSION"
          mkdir -p "$DEST"
          cp ../packaging/generated/winget/"$VERSION"/* "$DEST/"
          git add "$DEST"
          git commit -m "New version: Vibisual.Vibisual version $VERSION"
          git push -u origin "vibisual-$VERSION"
          gh pr create --repo microsoft/winget-pkgs \
            --head "${FORK%%/*}:vibisual-$VERSION" --base master \
            --title "New version: Vibisual.Vibisual version $VERSION" \
            --body "Automated submission from ${{ github.server_url }}/${{ github.repository }} (release $TAG)."

      # Homebrew tap — 공식 homebrew-cask 는 인지도 요건(별 75 등)에 막혀 우리 tap 에 올린다.
      # ⚠️ PAT 이 아니라 배포키로 민다 — PAT 은 그 계정의 모든 저장소에 쓸 수 있어 과하고, 배포키는 이 tap 에만 유효하다.
      - name: Homebrew tap 갱신
        if: env.TAP_DEPLOY_KEY != ''
        env:
          TAP: ${{ vars.HOMEBREW_TAP || 'Vibisual/homebrew-tap' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 여러 줄 비밀이라 printf 로 쏟는다(echo 는 셸마다 개행을 다르게 다룬다).
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly — 러너에 다른 키가 얹혀 있어도 이 키만 쓴다.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${TAP}.git" tap
          cd tap
          git config user.name  "vibisual-bot"
          git config user.email "noreply@vibisual.pro"
          mkdir -p Casks
          cp ../packaging/generated/homebrew/Casks/vibisual.rb Casks/vibisual.rb
          git add Casks/vibisual.rb
          # 내용이 그대로면 커밋하지 않는다. ⚠️ `git diff --quiet`(스테이징 전)로 바꾸지 마라 — 캐스크가 미추적인 첫 회에
          #    "바뀐 것 없음"이 나와 첫 파일이 영영 안 올라간다.
          if git diff --cached --quiet; then echo "바뀐 것이 없다."; exit 0; fi
          git commit -m "vibisual $VERSION"
          git push
