# 공개 지표 일일 스냅샷. GitHub 은 별·포크·릴리스 다운로드를 지금의 누적값으로만 줘 지난 값은 소급할 수 없다.
# 앱에는 텔레메트리를 넣지 않는다(PRIVACY.md) — 여기 값은 전부 GitHub 이 이미 공개하는 숫자다.
# METRICS_TOKEN: 조회·클론(`traffic.csv`)은 GitHub 이 14일만 보관하고 기본 `GITHUB_TOKEN` 으로는 못 부른다(`permissions:` 에
#   `administration` 키가 없다). 이 저장소에만 묶은 fine-grained PAT(`Administration: read`)를 넣는다 — 없으면 그 열만 빈다.
# 결과는 `metrics` 브랜치에 쌓인다(main 을 더럽히지 않고 CI 도 안 깨운다).
#   traction.csv         누적 게이지(별·포크·다운로드) — 하루 한 줄
#   traffic.csv          그날의 유량(조회·클론) — 14일치를 매번 덮어써 결손을 스스로 메운다
#   badge-stars.json     별 수 배지(shields endpoint). 다운로드 배지는 shields 표준 `github/downloads/…/total` 을 쓴다
#   stars-light/dark.svg 별 성장 곡선. README 가 <picture> 로 골라 쓴다
# GitHub 은 60일간 활동이 없는 저장소의 정기 워크플로를 멈춘다 — 멈췄다면 Actions 탭에서 다시 켠다.

name: Traction snapshot

on:
  schedule:
    # 03:17 UTC — 정각은 러너가 붐빈다.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traction
  cancel-in-progress: false

jobs:
  snapshot:
    name: 공개 지표 한 줄 적기
    runs-on: ubuntu-latest
    steps:
      - name: 스크립트 받기(main)
        uses: actions/checkout@v4

      - name: metrics 브랜치 준비
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/metrics
          cd /tmp/metrics
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin metrics 2>/dev/null; then
            git checkout -q FETCH_HEAD
            git checkout -q -b metrics
            echo "기존 metrics 브랜치를 이어 씁니다."
          else
            git checkout -q --orphan metrics
            echo "metrics 브랜치를 새로 만듭니다."
          fi

      - name: 스냅샷 한 줄 append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 없으면 트래픽 열만 빈다(머리말 참조).
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          REPO: ${{ github.repository }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/traction-snapshot.mjs" /tmp/metrics

      - name: 별 성장 곡선 다시 그리기
        env:
          REPO: ${{ github.repository }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/traction-chart.mjs" /tmp/metrics

      - name: 커밋·푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/metrics

          if [ ! -f README.md ]; then
            {
              echo "# Traction snapshots"
              echo ""
              echo "Appended once a day by \`.github/workflows/traction.yml\` on \`main\`."
              echo ""
              echo "| File | What it holds |"
              echo "| --- | --- |"
              echo "| \`traction.csv\` | One row per day: stars, forks, watchers, releases, download totals. |"
              echo "| \`traffic.csv\` | One row per day: views, unique visitors, clones, unique cloners. |"
              echo "| \`badge-stars.json\` | shields.io endpoint payload for a star-count badge. |"
              echo "| \`stars-*.svg\` | The star-history curve the README embeds, light and dark. |"
              echo ""
              echo "Every number here is public data that GitHub already exposes —"
              echo "stars, forks, watchers, release asset download counts, and this"
              echo "repository's own traffic. The application itself collects nothing;"
              echo "see PRIVACY.md on \`main\`."
              echo ""
              echo "\`update_checks\` counts downloads of the \`latest*.yml\` release assets."
              echo "electron-updater fetches those files when an installed copy checks for"
              echo "an update, so the number is a lower bound on installs that are still"
              echo "running — not a user count, and not tied to any individual. It is kept"
              echo "out of \`downloads_total\`, which counts installers only."
              echo ""
              echo "\`traffic.csv\` is blank until a \`METRICS_TOKEN\` secret exists: the"
              echo "traffic endpoints need repository administration read, which the"
              echo "workflow's built-in token cannot be granted. GitHub keeps only 14 days"
              echo "of traffic, so days before the first successful run cannot be recovered."
            } > README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 이 브랜치에는 우리 산출물만 있다.
          git add -A

          if git diff --cached --quiet; then
            echo "변한 값이 없어 커밋하지 않습니다."
            exit 0
          fi

          git commit -q -m "chore(metrics): snapshot $(date -u +%F)"
          git push -q origin metrics
          echo "metrics 브랜치에 기록했습니다."
