# DCO 서명 검사 — CONTRIBUTING.md 의 재라이선스 동의가 커밋 기록으로 남는지 확인한다. `Signed-off-by:` 없는 커밋이
# 하나라도 병합되면 그 코드의 저작권자는 조항에 동의한 적 없는 사람이 되고, 그 모듈은 듀얼 라이선스·유료 호스팅을 못 한다.
# 동의 장치는 두 겹: 1. 커밋의 `Signed-off-by:`(이 워크플로) 2. `.github/PULL_REQUEST_TEMPLATE.md` 의 확인란(읽고 체크).
# 판정: 병합 커밋을 뺀 모든 커밋에 작성자 주소와 같은 `Signed-off-by:` 줄이 있는가(대소문자 무시). 정규식 이스케이프 사고를
# 피하려고 주소는 `<>` 안에서 뽑아 문자열 그대로 비교한다.

name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base..head 범위 계산에 전체 이력이 필요하다.
          fetch-depth: 0

      - name: 커밋마다 서명 확인
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          checked=0

          # 병합 커밋은 제외한다 — 서명은 원 커밋에 붙어 있다.
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            checked=$((checked + 1))
            author_email="$(git log -1 --format='%ae' "$sha" | tr '[:upper:]' '[:lower:]')"
            subject="$(git log -1 --format='%s' "$sha")"
            signed="$(git log -1 --format='%B' "$sha" \
              | sed -n 's/^[Ss]igned-off-by:.*<\(.*\)>.*$/\1/p' \
              | tr '[:upper:]' '[:lower:]')"

            if printf '%s\n' $signed | grep -qxF "$author_email"; then
              echo "  ok    ${sha} — ${subject}"
            else
              echo "  MISS  ${sha} — ${subject}"
              echo "        author <${author_email}> has no matching Signed-off-by line."
              missing=$((missing + 1))
            fi
          done

          echo ""
          echo "commits checked: ${checked} / missing sign-off: ${missing}"

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "----------------------------------------------------------------"
            echo "Every commit needs a Developer Certificate of Origin sign-off."
            echo "See CONTRIBUTING.md for the full text and why it matters here."
            echo ""
            echo "Fix the most recent commit:"
            echo "    git commit --amend --signoff"
            echo ""
            echo "Fix every commit in this pull request:"
            echo "    git rebase --signoff ${BASE_SHA}"
            echo ""
            echo "Then force-push the branch."
            echo "----------------------------------------------------------------"
            exit 1
          fi
