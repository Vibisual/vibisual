# 플랫폼 동등성 검증 — Windows·macOS·Linux 에서 타입체크와 테스트를 모두 돌린다. POSIX 에서만 깨지는 결함
# (경로 대소문자 접기, 프로세스 그룹 킬, PATH 미상속, Wayland 캡처)은 Windows 개발로는 안 보인다.
# 빨갛다고 꺼 두지 마라 — 그 플랫폼에서 성립할 수 없는 케이스는 그 테스트에 사유를 적어 skip 한다.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연속 푸시하면 앞선 런은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      # 한 플랫폼이 넘어져도 나머지를 본다 — "mac 만 깨졌나, 셋 다 깨졌나"가 원인 분류의 첫 갈림길이다.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: verify (${{ matrix.os }})
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 릴리스 본문의 자산 분류 규칙(win/mac-arm64/mac-x64/deb/rpm/AppImage) — 의존성 없는 순수 JS 라 설치 앞에 둔다.
      # ⚠️ 규칙이 뒤집히면 Apple Silicon dmg 가 Intel 줄에 실려도 표는 멀쩡해 보인다(릴리스 때 잡으면 이미 자산이 나간 뒤다).
      - name: Release notes classifier selftest
        run: node .github/scripts/release-notes.mjs --selftest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 이 패키지들은 dist 를 내야 다른 패키지가 타입을 본다. ⚠️ server 를 빠뜨리면 desktop/main 이 server 를 import 해
      # desktop typecheck 가 `Cannot find module '@vibisual/server'` 로 죽는다. 패키징은 release.yml 몫이다.
      - name: Build workspace packages
        run: pnpm --filter=@vibisual/shared --filter=@vibisual/plugins --filter=@vibisual/video --filter=@vibisual/audio --filter=@vibisual/server -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
