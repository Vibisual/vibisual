# 플랫폼 동등성 검증 — Windows·macOS·Linux 에서 타입체크와 테스트를 모두 돌린다. POSIX 에서만 깨지는 결함
# (경로 대소문자 접기, 프로세스 그룹 킬, PATH 미상속, Wayland 캡처)은 Windows 개발로는 안 보인다.
# 빨갛다고 꺼 두지 마라 — 그 플랫폼에서 성립할 수 없는 케이스는 그 테스트에 사유를 적어 skip 한다.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연속 푸시하면 앞선 런은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      # 한 플랫폼이 넘어져도 나머지를 본다 — "mac 만 깨졌나, 셋 다 깨졌나"가 원인 분류의 첫 갈림길이다.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: verify (${{ matrix.os }})
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 릴리스 본문의 자산 분류 규칙(win/mac-arm64/mac-x64/deb/rpm/AppImage) — 의존성 없는 순수 JS 라 설치 앞에 둔다.
      # ⚠️ 규칙이 뒤집히면 Apple Silicon dmg 가 Intel 줄에 실려도 표는 멀쩡해 보인다(릴리스 때 잡으면 이미 자산이 나간 뒤다).
      - name: Release notes classifier selftest
        run: node .github/scripts/release-notes.mjs --selftest

      - name: Install Rust compute target
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 이 패키지들은 dist 를 내야 다른 패키지가 타입을 본다. ⚠️ server 를 빠뜨리면 desktop/main 이 server 를 import 해
      # desktop typecheck 가 `Cannot find module '@vibisual/server'` 로 죽는다. 패키징은 release.yml 몫이다.
      - name: Build workspace packages
        run: pnpm --filter=@vibisual/compute --filter=@vibisual/shared --filter=@vibisual/plugins --filter=@vibisual/video --filter=@vibisual/audio --filter=@vibisual/server -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 앱 통째 스모크(packages/desktop/e2e) — 빌드한 앱을 새 사용자로 띄워 첫 실행 게이트 → 폴더 → 버블 → 첫 명령 →
      # 상태 변화 → 종료 → 재실행 복원을 한 줄로 돈다. 엔진은 공식 CLI 문서 표를 따르는 가짜라 CLI 호환 계약 시험을 겸한다.
      # 단위 시험이 못 보는 자리(실행본 해석·.cmd 스폰·훅 왕복·저장/복원)가 mac·Linux 에서 깨지는 것을 여기서만 본다.
      - name: Build desktop app
        run: pnpm --filter @vibisual/desktop build

      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: App smoke (fake engines)
        shell: bash
        env:
          VIBISUAL_E2E_ARTIFACTS: ${{ runner.temp }}/vibisual-e2e
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm --filter @vibisual/desktop e2e
          else
            pnpm --filter @vibisual/desktop e2e
          fi

      # 실패한 OS 의 단계별 화면·앱 로그·가짜 엔진 호출 기록. 사람이 그 OS 를 손으로 열어 보지 않아도 원인을 고른다.
      - name: Upload app smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/vibisual-e2e
          if-no-files-found: ignore
          retention-days: 7
