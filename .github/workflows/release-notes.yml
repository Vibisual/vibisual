# SCENARIO.md §4 — 이미 발행된 릴리스의 본문을 다시 쓴다(앞으로 나갈 릴리스는 `release.yml` 의 `notes` 잡).
# Actions → "Release notes" → Run workflow → 태그 입력 → Run. 태그를 비우면 최신 릴리스를 고친다.
# 제목은 버전 숫자만 — 손으로 붙인 제목은 덮지 않고 `Vibisual <버전>` 만 정규화한다(release-notes.mjs `releaseTitle`, `--selftest`).
# 본문은 자산 목록에서 매번 다시 쓴다.

name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '본문을 다시 쓸 태그 (예: v0.1.14). 비우면 최신 릴리스.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rewrite release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node .github/scripts/release-notes.mjs --selftest
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            # 최신 릴리스 태그(draft/prerelease 제외).
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/releases/latest \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).tag_name))")
            echo "태그를 안 줬다 — 최신 릴리스 $TAG 를 고친다."
          fi
          node .github/scripts/release-notes.mjs "${TAG#v}" --apply
