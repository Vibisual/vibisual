# macOS 실기 없이 맥에서 앱이 어떻게 보이는지 확인한다 — GitHub macOS 러너에서 앱을 띄우고 화면을 주기적으로 찍어
# 아티팩트로 돌려준다. Windows PC 에 macOS 를 가상화하지 않는다 — Apple 사용권 계약은 Apple 하드웨어에서만 허용한다.
# smoke.yml 은 "25초 뒤에도 살아 있는가"만, 이것은 창·레이아웃·폰트·신호등·메뉴가 어떻게 보이는가를 본다.
# 직접 만져야 하면 `tmate` 입력을 켠다(실행한 본인 SSH 키만 허용). SSH 는 셸이라 화면은 `screencapture -x` 로 본다.

name: Try on macOS (screenshots)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (비우면 최신 릴리스)'
        required: false
        default: ''
      arch:
        description: '어느 맥에서 볼까'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x64
          - both
      minutes:
        description: '앱을 몇 분 띄워 둘까 (스크린샷을 찍는 구간)'
        required: false
        default: '3'
      interval:
        description: '스크린샷 간격(초)'
        required: false
        default: '15'
      tmate:
        description: '러너에 SSH 로 붙어 직접 만져 보기 (최대 6시간, 본인 키만 허용)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  look:
    strategy:
      fail-fast: false
      matrix:
        # 릴리스와 같은 러너 짝을 쓴다 — 다른 러너에서 돌리면 Rosetta 가 Intel 실기 결함을 가린다.
        include:
          - arch: arm64
            os: macos-latest
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    name: look (${{ matrix.arch }})
    # matrix 는 입력으로 못 줄여 고르지 않은 쪽 잡은 첫 스텝에서 비켜선다(몇 초 만에 끝난다).
    # tmate SSH 세션이 잘리지 않게 넉넉히 둔다(호스트 러너 상한 360분).
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 러너의 ~/.claude/settings.json 을 건드리지 않는다 — 보려는 것은 화면이다.
      VIBISUAL_SKIP_HOOK_INSTALL: '1'

    steps:
      - name: 이 아키텍처를 돌릴지 판단
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          WANT="${{ inputs.arch }}"
          MINE="${{ matrix.arch }}"
          if [ "$WANT" = "both" ] || [ "$WANT" = "$MINE" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "이 잡은 건너뛴다 (요청: $WANT / 이 러너: $MINE)"
          fi

      - name: 태그 확정
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "대상 태그: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: dmg 내려받기 (이 아키텍처 것만)
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          # 파일명 규약: arm64 는 `-arm64.dmg`, Intel 은 접미사 없는 `.dmg`.
          # ⚠️ 공개된 그 파일을 재므로 릴리스 자산을 받는다(다운로드 수 +1, 수동 전용이라 감수).
          #    자동으로 도는 `smoke.yml` 에는 이 경로를 되돌리지 마라 — 거기는 아티팩트로 받는다.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-arm64.dmg' --dir artifact
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir artifact
            rm -f artifact/*-arm64.dmg
          fi
          ls -la artifact

      - name: 설치 (dmg → ~/Applications)
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -quiet artifact/*.dmg
          SRC=$(ls -d /Volumes/Vibisual*/Vibisual.app 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then echo "::error::dmg 안에서 Vibisual.app 을 못 찾았다"; ls -la /Volumes || true; exit 1; fi
          # dmg 볼륨은 읽기 전용이라 실제 사용자와 같은 조건(설치된 앱)으로 맞춘다.
          mkdir -p "$HOME/Applications"
          ditto "$SRC" "$HOME/Applications/Vibisual.app"
          hdiutil detach -force "$(dirname "$SRC")" >/dev/null 2>&1 || true
          # 격리 속성이 붙어 있으면 미서명이라 Gatekeeper 가 막는다 — 보려는 것은 화면이라 그 변수를 없앤다.
          xattr -dr com.apple.quarantine "$HOME/Applications/Vibisual.app" 2>/dev/null || true
          echo "APP=$HOME/Applications/Vibisual.app" >> "$GITHUB_ENV"

      - name: 서명·Gatekeeper 실측 (정보 수집)
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -uo pipefail
          echo "== codesign =="; codesign -dv --verbose=4 "$APP" 2>&1 | head -20 || true
          echo "== spctl =="; spctl -a -t exec -vv "$APP" 2>&1 | head -10 || true

      - name: 앱 띄우고 화면 찍기
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -uo pipefail
          MINUTES="${{ inputs.minutes }}"
          INTERVAL="${{ inputs.interval }}"
          mkdir -p shots
          # `open` 이 아니라 실행 파일을 직접 부른다 — 죽었을 때 stdout/stderr 를 잡는다.
          arch -"$(uname -m)" "$APP/Contents/MacOS/Vibisual" > shots/run.log 2>&1 &
          APP_PID=$!
          # 첫 창까지의 여유(main 이 서버를 함께 띄운다).
          sleep 20

          TOTAL=$(( MINUTES * 60 ))
          ELAPSED=0
          N=0
          ALIVE=1
          while [ "$ELAPSED" -lt "$TOTAL" ]; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::앱이 ${ELAPSED}초 만에 죽었다"
              ALIVE=0
              break
            fi
            N=$((N + 1))
            LABEL=$(printf '%03d' "$N")
            # -x 는 촬영음 없음. 실패해도 흐름을 끊지 않고 로그에 남긴다(그 사실이 다음 조사의 단서다).
            if screencapture -x "shots/${LABEL}-t${ELAPSED}s.png" 2>>shots/capture.log; then
              echo "찍음: ${LABEL} (t=${ELAPSED}s)"
            else
              echo "::warning::screencapture 실패 (t=${ELAPSED}s) — shots/capture.log 참고"
            fi
            # 창 목록도 남긴다(접근성 권한이 없으면 빈다).
            osascript -e 'tell application "System Events" to get name of every window of (every process whose name is "Vibisual")' \
              >> shots/windows.txt 2>/dev/null || true
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ "$ALIVE" = "1" ]; then
            echo "OK — ${TOTAL}초 동안 살아 있었다. 스크린샷 ${N}장."
          fi
          screencapture -x "shots/999-final.png" 2>>shots/capture.log || true
          kill "$APP_PID" 2>/dev/null || true
          {
            echo "### macOS ${{ matrix.arch }} — \`$TAG\`"
            echo ""
            echo "- 스크린샷 ${N}장 (간격 ${INTERVAL}초 / ${MINUTES}분)"
            echo "- 앱 생존: $([ "$ALIVE" = "1" ] && echo 예 || echo '아니오 — run.log 확인')"
            echo ""
            echo '<details><summary>run.log 마지막 40줄</summary>'
            echo ''
            echo '```'
            tail -40 shots/run.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ALIVE" = "1" ]

      # ⚠️ `always() && …` 로 쓰지 마라 — 취소된 런에서도 돈다. 앱이 죽어도 찍힌 것은 봐야 해 `!cancelled()` 를 쓴다.
      - name: 스크린샷 올리기
        if: ${{ !cancelled() && steps.gate.outputs.run == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-screens
          path: shots
          # 한 번 보고 버리는 것이라 짧게 둔다.
          retention-days: 3
          if-no-files-found: warn

      # 직접 만져 보기(opt-in) — 켜면 잡이 SSH 접속을 기다리며 최대 6시간 머문다. `limit-access-to-actor` = 실행한 본인 키만.
      # ⚠️ 제3자 액션이다 — 수동 실행 + 기본 꺼짐이라 상시 노출면이 아니다.
      - name: SSH 접속 열기 (tmate)
        if: steps.gate.outputs.run == 'yes' && inputs.tmate
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
