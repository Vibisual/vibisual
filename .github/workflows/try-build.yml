# 지금 브랜치를 리눅스·맥 설치본으로 지어 아티팩트로 돌려준다 — 발행하지 않는다(태그·latest.yml·업데이트 신호 없음).
# 윈도우에서 `--linux` 로 지으면 네이티브 모듈(node-pty · koffi · better_sqlite3)이 윈도우용으로 들어가 리눅스에서 기동 즉시
# 죽는다(release.yml 머리말의 koffi 와 같은 종류) — 그래서 그 OS 의 러너가 짓는다.
# 받은 뒤: 리눅스는 `node scripts/try-linux.mjs --file <풀린 .AppImage>` 로 WSLg 창에 띄운다. 맥은 패키징이 되는가의
# 초록/빨강만 얻는다 — 화면은 try-mac.yml(발행된 릴리스의 스크린샷).

name: Try build (branch artifacts)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '무엇을 지을까'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - mac-arm64
          - mac-x64
          - linux+mac
      retention:
        description: '아티팩트 보관 일수'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            script: build:linux
            # AppImage 만으로는 libfuse2 가 따로 필요해(electron-builder.yml linux 주석) deb/rpm 도 올린다 — `/reinstall-linux` 가 이 deb 를 설치한다.
            glob: |
              packages/desktop/dist/*.AppImage
              packages/desktop/dist/*.deb
              packages/desktop/dist/*.rpm
          - target: mac-arm64
            os: macos-latest
            script: build:mac
            glob: |
              packages/desktop/dist/*.dmg
          - target: mac-x64
            os: macos-15-intel
            script: build:mac
            glob: |
              packages/desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.target }})
    timeout-minutes: 40

    steps:
      - name: 이 타깃을 지을지 판단
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          WANT="${{ inputs.targets }}"
          MINE="${{ matrix.target }}"
          RUN=no
          case "$WANT" in
            linux)      [ "$MINE" = "linux" ] && RUN=yes ;;
            mac-arm64)  [ "$MINE" = "mac-arm64" ] && RUN=yes ;;
            mac-x64)    [ "$MINE" = "mac-x64" ] && RUN=yes ;;
            linux+mac)  RUN=yes ;;
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          [ "$RUN" = "yes" ] || echo "건너뛴다 (요청: $WANT / 이 잡: $MINE)"

      - name: Checkout
        if: steps.gate.outputs.run == 'yes'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.gate.outputs.run == 'yes'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: pnpm install --frozen-lockfile

      # `build:*` 는 --publish 없이 파일만 낸다. mac 은 아키텍처 플래그 없이 호스트 아키텍처를 따른다(`mac.arch` 를 비워 둠) —
      # 잡마다 그 아키텍처의 러너라 네이티브 모듈과 짝이 맞는다.
      - name: Build installer
        if: steps.gate.outputs.run == 'yes'
        run: pnpm run ${{ matrix.script }}
        env:
          # 미서명 빌드를 실패시키지 않는다(release.yml 과 같다).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 결과 확인
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -uo pipefail
          ls -la packages/desktop/dist || true
          {
            echo "### ${{ matrix.target }} — \`${{ github.ref_name }}\` (${GITHUB_SHA:0:8})"
            echo ""
            echo '```'
            ls -la packages/desktop/dist 2>/dev/null | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 설치본 올리기
        if: ${{ !cancelled() && steps.gate.outputs.run == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibisual-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.glob }}
          retention-days: ${{ fromJSON(inputs.retention) }}
          if-no-files-found: error
          # 이미 압축된 설치본이다 — 다시 압축해 봐야 시간만 쓴다.
          compression-level: 0
