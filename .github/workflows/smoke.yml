# 발행된 **릴리스 산출물이 그 OS 에서 실제로 실행되는가**를 재는 워크플로.
#
# ⚠️ ci.yml 과 재는 것이 다르다. ci.yml 은 "소스가 이 OS 에서 성립하는가"(typecheck + test)만 본다.
#    그게 초록이어도 사용자에게는 안 되는 앱일 수 있다 — dmg 가 Gatekeeper 에 막히거나, 네이티브
#    모듈이 아키텍처와 어긋나 창이 뜨기도 전에 죽으면 소스는 아무 잘못이 없는데 앱은 실행 불가다.
#    그 구간은 **빌드가 아니라 실행으로만** 드러난다.
#
#    실제로 겪은 일이다(멀티플랫폼 정본 §2.4): 한 러너에서 두 아키텍처를 함께 뽑은 x64 dmg 는
#    `koffi` 가 제 바이너리를 못 찾아 main 프로세스가 뜨자마자 죽었다 — **빌드는 초록, 앱은 실행 불가.**
#    그런 것을 잡으라고 있는 워크플로다.
#
# **릴리스가 끝나면 자동으로 한 번 돈다**(workflow_run) + 아무 때나 수동으로도 돈다(workflow_dispatch).
# 처음에는 수동 전용이었는데, 그러면 결국 아무도 누르지 않는다 — 실제로 v0.1.13·v0.1.14 가 발행된 뒤
# 한참 지나서야 처음 돌렸고, 그때 mac Gatekeeper 차단과 linux FUSE 차단이 **둘 다 이미 배포된 상태**로
# 발견됐다. 발행과 검증 사이에 사람의 기억이 끼면 그 틈으로 결함이 사용자에게 먼저 도착한다.
#
# ⚠️ `workflow_run` 을 쓰는 이유: release.yml 안에서 `gh workflow run` 으로 부르는 방법은 **동작하지
#    않는다** — GITHUB_TOKEN 이 일으킨 이벤트는 새 워크플로를 띄우지 않는다(무한 재귀 방지 규칙).
#    `workflow_run` 은 그 제약을 받지 않는 정규 경로다.
#
# 판정 신호는 "25초 뒤에도 살아 있는가" 하나다. 위의 즉사류 결함은 전부 기동 직후에 드러나므로
# 이 한 줄로 충분하고, 죽었으면 stdout/stderr 를 그대로 뱉어 원인을 남긴다.

name: Smoke (installed app)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '검증할 릴리스 태그 (비우면 최신 릴리스)'
        required: false
        default: ''
      publish:
        description: '통과하면 draft 를 해제해 공개 발행한다 (스모크가 막아 draft 로 남은 릴리스를 고친 뒤 되살리는 손잡이)'
        type: boolean
        required: false
        default: false
  # 릴리스 빌드가 **끝난 뒤**에 돈다. `release: [published]` 는 쓸 수 없다 — 4개 잡 중 처음 끝난
  # 하나가 릴리스를 만드는 순간 발화하므로, 나머지 셋의 자산이 아직 안 올라온 상태를 재게 된다.
  workflow_run:
    workflows: ['Release']
    types: [completed]

# ⚠️ `write` 다 — 이 워크플로가 **공개 발행의 유일한 스위치**이기 때문이다(아래 `publish` 잡).
# 자산은 draft 로 올라오고, 여기서 실기 검증을 통과해야 공개로 바뀐다.
permissions:
  contents: write

jobs:
  smoke:
    strategy:
      # 한 OS 가 넘어져도 나머지를 봐야 한다 — "mac 만 죽나, 넷 다 죽나"가 원인 분류의 첫 갈림길이다.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64 (AppImage)
          # mac 은 아키텍처마다 그 아키텍처의 러너에서 **실행까지** 해 봐야 의미가 있다.
          # arm64 러너에서 x64 dmg 를 돌리면 Rosetta 가 덮어 주어 Intel 실기의 진실이 가려진다.
          - os: macos-latest
            label: mac-arm64 (dmg)
          - os: macos-15-intel
            label: mac-x64 (dmg)
          - os: windows-latest
            label: win-x64 (nsis)
    runs-on: ${{ matrix.os }}
    name: smoke (${{ matrix.label }})
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 러너의 ~/.claude/settings.json 을 건드리지 않는다(README 의 opt-out). 우리가 재려는 것은
      # "앱이 뜨고 살아 있는가"이지 훅 설치가 아니다 — 부작용을 줄여 실패 원인을 좁힌다.
      VIBISUAL_SKIP_HOOK_INSTALL: '1'

    steps:
      # ── 검증할 태그 확정 ────────────────────────────────────────────────
      - name: Resolve tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          # 릴리스가 끝나서 자동으로 불려 온 경우, 그 런이 빌드한 **바로 그 태그**를 쓴다.
          # 태그 push 로 돈 워크플로의 `head_branch` 에는 태그 이름이 들어 있다.
          # (release.yml 을 손으로 dispatch 한 경우엔 브랜치 이름이 오므로 v 로 시작하는지 본다.)
          if [ -z "$TAG" ]; then TAG="${{ github.event.workflow_run.head_branch }}"; fi
          case "$TAG" in v*) ;; *) TAG="" ;; esac
          if [ -z "$TAG" ]; then
            # ⚠️ `gh release view` 를 쓰지 마라 — 그것은 **draft 를 건너뛴다.** 우리가 재려는 것은
            #    방금 올라온 draft 이므로 그걸로 떨어지면 한 판올림 옛것을 검증하고 통과시킨다.
            #    `gh release list` 는 권한이 있으면 draft 도 함께 준다.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
            echo "태그를 못 받아 최신 릴리스(draft 포함)로 떨어졌다."
          fi
          echo "검증 대상 태그: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # ── Linux ──────────────────────────────────────────────────────────
      # ⓪ **권장 경로부터 잰다** — deb 를 설치해서 실행. 여기가 통하면 사용자에게
      #    "libfuse2 를 까세요" 같은 말을 할 필요가 아예 없어진다. 안내문을 쓰는 것보다
      #    포장을 바꾸는 편이 낫다는 판단(2026-08-28)이 실제로 성립하는지를 재는 자리다.
      - name: Linux — 실사용자 재현 (deb 설치 → 그냥 실행)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.deb" --dir debpkg || true
          if ! ls debpkg/*.deb >/dev/null 2>&1; then
            echo "::warning::이 릴리스에는 .deb 가 없다(deb 타깃 추가 이전 버전) — 건너뛴다"
            exit 0
          fi
          ls -la debpkg
          # 사용자가 하는 것과 같다: 받은 파일을 apt 에 넘기면 **의존성은 apt 가 끌어온다.**
          sudo apt-get update -qq
          if ! sudo apt-get install -y ./debpkg/*.deb; then
            echo "::error::deb 설치 실패 — depends 목록이 이 배포판과 안 맞는다(t64 전환 등)"
            dpkg -I ./debpkg/*.deb | sed -n "1,40p"
            exit 1
          fi
          echo "== 설치 결과 =="
          command -v vibisual || { echo "::error::vibisual 이 PATH 에 없다"; dpkg -L vibisual | head -40; exit 1; }
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          xvfb-run -a vibisual > deb-run.log 2>&1 &
          DPID=$!
          sleep 25
          if kill -0 "$DPID" 2>/dev/null; then
            echo "RESULT: deb 는 **아무 것도 따로 깔지 않고** 그대로 실행된다 — 안내문이 필요 없다."
          else
            echo "::error::deb 설치본이 25초 안에 죽었다"
            tail -80 deb-run.log || true
            exit 1
          fi
          # 다음 스텝이 단일 인스턴스 락에 걸리지 않도록 트리째 회수한다.
          # 설치 경로로 좁혀 죽인다 — 이름만으로 `pkill -f vibisual` 하면 러너의 작업 디렉터리가
          # 저장소 이름과 같아서, 그 경로를 cmdline 에 가진 남의 프로세스까지 잡아 잡 자체가 죽는다.
          kill "$DPID" 2>/dev/null || true
          pkill -f "/opt/Vibisual" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3

      # ① 아래부터는 **AppImage** 경로 — deb/rpm 이 안 통하는 배포판(Arch·NixOS)용 대체재다.
      - name: Linux — download AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --dir artifact
          ls -la artifact

      # ── ① 실사용자 경로: AppImage 를 **그대로** 실행 ────────────────────
      # 사용자는 `--appimage-extract` 를 하지 않는다. 받아서 실행 권한 주고 더블클릭한다.
      # 그 경로는 AppImage type2 런타임이 FUSE 를 요구하는데, 요즘 우분투에는 기본으로 없다.
      # 아래 두 스텝이 재는 것은 앱이 아니라 **사용자가 그 앱을 열 수 있는가**다.
      - name: Linux — 실사용자 재현 (AppImage 를 그대로 실행)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null   # 러너에 디스플레이가 없다
          echo "== FUSE 관련 패키지 설치 상태(러너 기본) =="
          dpkg -l | grep -iE "libfuse|fuse3?" | awk '{print "   " $2 " " $3}' | head -5 || echo "   (없음)"
          cd artifact
          chmod +x ./*.AppImage
          echo "== 그대로 실행 =="
          xvfb-run -a ./*.AppImage --no-sandbox > direct.log 2>&1 &
          DPID=$!
          sleep 20
          if kill -0 "$DPID" 2>/dev/null; then
            echo "RESULT: FUSE 를 따로 깔지 않아도 AppImage 가 그대로 실행된다 — 사용자는 chmod +x 만 하면 된다."
            echo "APPIMAGE_NEEDS_FUSE=no" >> "$GITHUB_ENV"
          else
            echo "RESULT: 그대로는 실행되지 않는다 — 아래가 사용자가 보게 되는 것이다."
            tail -25 direct.log || true
            echo "APPIMAGE_NEEDS_FUSE=yes" >> "$GITHUB_ENV"
          fi
          # ⚠️ `kill $DPID` 만으로는 부족하다 — 그건 `xvfb-run` 의 PID 이고 **앱은 그 자식**이라 살아남는다.
          #    그리고 이 앱은 단일 인스턴스 락을 쓰므로, 남은 인스턴스가 있으면 **다음 스텝이 띄우는
          #    두 번째 인스턴스는 즉시 종료된다** — run #4 의 "Linux — run" 실패가 정확히 이것이었다
          #    (Complete job 로그에 @vibisualdesktop·AppImage 가 고아로 남아 있었다).
          kill "$DPID" 2>/dev/null || true
          pkill -f "@vibisualdesktop" 2>/dev/null || true
          pkill -f "[.]AppImage" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3
          # ⚠️ 여기서 실패해도 잡을 죽이지 않는다. 이건 앱 결함이 아니라 **포장 형식의 전제**이고,
          #    우리가 알아야 하는 것은 "그래서 README 에 무엇을 적어야 하는가"다. 다음 스텝이 답한다.

      - name: Linux — 안내가 통하는지 (libfuse2 설치 후 재시도)
        if: runner.os == 'Linux' && env.APPIMAGE_NEEDS_FUSE == 'yes'
        shell: bash
        run: |
          set -uo pipefail
          # 우분투 24.04 는 패키지명이 libfuse2t64, 22.04 는 libfuse2 다. 둘 다 시도한다 —
          # README 에 적을 안내가 **실제로 통하는지** 확인하는 자리이므로 여기서 실패하면 진짜 문제다.
          sudo apt-get install -y -qq libfuse2t64 >/dev/null 2>&1 || sudo apt-get install -y -qq libfuse2 >/dev/null 2>&1 || true
          dpkg -l | grep -iE "libfuse2" | awk '{print "   설치됨: " $2 " " $3}' | head -3
          cd artifact
          xvfb-run -a ./*.AppImage --no-sandbox > fuse.log 2>&1 &
          FPID=$!
          sleep 20
          RC=0
          if kill -0 "$FPID" 2>/dev/null; then
            echo "RESULT: libfuse2 를 깔면 정상 실행된다 — 그 안내는 유효하다."
          else
            echo "::error::libfuse2 를 깔아도 실행되지 않는다 — README 안내를 그대로 쓰면 안 된다"
            tail -30 fuse.log || true
            RC=1
          fi
          # 다음 스텝이 두 번째 인스턴스로 튕기지 않게 트리째 회수한다(위 스텝 주석 참고).
          kill "$FPID" 2>/dev/null || true
          pkill -f "@vibisualdesktop" 2>/dev/null || true
          pkill -f "[.]AppImage" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3
          exit $RC

      # ── ② 앱 자체 검증: 포장 변수를 없애고 실행 ─────────────────────────
      - name: Linux — run
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          # 위 ①이 포장(FUSE)까지 포함한 사용자 경로라면, 이 스텝은 그 변수를 걷어내고
          # **앱 자신이 도는가**만 격리해서 잰다. 둘이 갈리면 원인이 어느 쪽인지 바로 안다.
          # (xvfb 는 ① 에서 설치했다.)
          # 앞 스텝의 인스턴스가 남아 있으면 이 스텝은 단일 인스턴스 락에 걸려 **앱 결함이 아닌
          # 이유로** 즉사한다. 들어오면서 한 번 더 쓸어낸다(앞 스텝이 실패로 끝났을 수도 있다).
          pkill -f "@vibisualdesktop" 2>/dev/null || true
          pkill -f "[.]AppImage" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3
          cd artifact
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          # ⚠️ AppRun 은 자기 위치를 **환경변수 APPDIR 로 받는다.** AppImage 를 그대로 실행하면
          #    런타임이 그것을 채워 주지만, --appimage-extract 로 풀어서 직접 부르면 비어 있어
          #    `/<실행파일>` 이라는 루트 경로를 찾다 죽는다 — 1차 실측(run #1)에서 정확히
          #    `./squashfs-root/AppRun: line 45: /@vibisualdesktop: No such file or directory` 였다.
          #    앱 결함이 아니라 실행 방법의 결함이므로 APPDIR 를 채워 준다.
          #    (실행 파일명이 `@vibisualdesktop` 인 것은 electron-builder 가 `executableName`
          #     미지정 시 package.json 의 `@vibisual/desktop` 에서 파생하기 때문이다.)
          export APPDIR="$PWD/squashfs-root"
          # Electron 의 SUID 샌드박스는 CI 러너에서 자주 막힌다 — 앱 결함과 뒤섞이지 않게 끈다.
          xvfb-run -a "$APPDIR/AppRun" --no-sandbox > run.log 2>&1 &
          APP_PID=$!
          sleep 25
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "OK — 25초 생존. 앱이 떴다."
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "::error::앱이 25초 안에 죽었다"
            echo "── run.log ──"; tail -80 run.log || true
            exit 1
          fi

      # ── macOS ──────────────────────────────────────────────────────────
      - name: macOS — download dmg (아키텍처에 맞는 것만)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 파일명 규약: arm64 는 `-arm64.dmg`, Intel 은 접미사 없는 `.dmg`.
          # 아키텍처가 어긋난 dmg 를 집으면 그것이야말로 이 워크플로가 잡으려는 즉사 사고다.
          if [ "$(uname -m)" = "arm64" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-arm64.dmg' --dir artifact
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir artifact
            rm -f artifact/*-arm64.dmg
          fi
          ls -la artifact

      - name: macOS — 서명·Gatekeeper 실측 (정보 수집, 실패시키지 않음)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          hdiutil attach -nobrowse -quiet artifact/*.dmg
          APP=$(ls -d /Volumes/Vibisual*/Vibisual.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::error::dmg 안에서 Vibisual.app 을 못 찾았다"; ls -la /Volumes || true; exit 1; fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "== codesign =="
          codesign -dv --verbose=4 "$APP" 2>&1 | head -25 || true
          echo "== spctl (Gatekeeper 평가) =="
          # 미서명이면 여기서 rejected 가 난다. 그건 이미 아는 사실이라 잡을 실패로 삼지 않고
          # **문구를 그대로 남긴다** — 사용자가 첫 실행에서 무엇을 보게 되는지가 이 줄에 있다.
          spctl -a -t exec -vv "$APP" 2>&1 | head -10 || true

      - name: macOS — launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          arch -"$(uname -m)" "$APP/Contents/MacOS/Vibisual" > run.log 2>&1 &
          APP_PID=$!
          sleep 25
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "OK — 25초 생존. 앱이 떴다."
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "::error::앱이 25초 안에 죽었다 (아키텍처 불일치·네이티브 모듈·서명 거부 등)"
            echo "── run.log ──"; tail -80 run.log || true
            exit 1
          fi

      # ── 실사용자 재현: 받아서 여는 것까지 한 스텝에서 ──────────────────
      # ⚠️ 이 검증은 **반드시 한 스텝 안에서** 끝내야 한다. 스텝을 갈랐더니 run #5 에서 사본이 통째로
      #    사라졌다(`xattr: No such file`) — `spctl` 이 "notarization ... has been revoked" 로 판정한
      #    번들을 `open` 하면 macOS 가 그것을 격리·이동시킬 수 있기 때문이다. 그래서 부착·개봉·우회·
      #    재개봉을 한 셸에서 이어서 하고, **매 단계 앞에서 사본을 다시 만들어** 전제를 스스로 세운다.
      #
      # 그리고 위 launch 스텝과 재는 것이 다르다: 저기는 터미널에서 바이너리를 직접 부르므로
      # Gatekeeper 를 타지 않는다. 여기는 `open`(LaunchServices) + quarantine 이라 **사용자가 겪는 것**이다.
      - name: macOS — 실사용자 재현 (quarantine → open → xattr -cr → 재시도)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/qtest"

          make_copy() {   # 매번 깨끗한 사본 — 앞 단계에서 시스템이 번들을 건드렸을 수 있다
            rm -rf "$WORK"; mkdir -p "$WORK"
            cp -R "$APP" "$WORK/Vibisual.app" || { echo "::error::앱 사본 생성 실패: $APP"; exit 1; }
            [ -d "$WORK/Vibisual.app" ] || { echo "::error::사본이 없다: $WORK/Vibisual.app"; exit 1; }
          }

          add_quarantine() {  # Safari 가 붙이는 것과 같은 형식: 플래그;시각(hex);에이전트;UUID
            xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$WORK/Vibisual.app"
          }

          try_open() {    # `open` 은 경고 다이얼로그에 걸리면 영영 안 돌아온다 → 백그라운드 + 폴링
            OPENED=no; STALLED=no
            open "$WORK/Vibisual.app" >/dev/null 2> "$1" &
            opid=$!
            for _ in $(seq 1 15); do kill -0 "$opid" 2>/dev/null || break; sleep 2; done
            if kill -0 "$opid" 2>/dev/null; then STALLED=yes; kill "$opid" 2>/dev/null || true; fi
            sleep 3
            if pgrep -f "qtest/Vibisual.app/Contents/MacOS" >/dev/null 2>&1; then OPENED=yes; fi
            pkill -f "qtest/Vibisual.app" 2>/dev/null || true
            sleep 2
          }

          # ── ① 사용자가 브라우저로 받아 Finder 로 여는 상황 ───────────────
          make_copy
          add_quarantine
          echo "== 부착된 quarantine =="
          xattr -p com.apple.quarantine "$WORK/Vibisual.app" 2>&1 || true
          echo "== spctl 평가 =="
          spctl -a -t exec -vv "$WORK/Vibisual.app" 2>&1 | head -5 || true
          echo "== open (사용자가 하는 방식) =="
          try_open open1.err
          if [ "$OPENED" = "yes" ]; then
            echo "RESULT-1: quarantine 이 붙어도 열린다 — 사용자는 우회 없이 실행할 수 있다."
            BLOCKS=no
          elif [ "$STALLED" = "yes" ]; then
            echo "RESULT-1: open 이 30초간 돌아오지 않았다 — **경고 다이얼로그가 떠서 클릭을 기다리는 상태**다."
            echo "          사용자에게는 '경고창이 뜨고 그냥은 못 연다'로 나타난다."
            cat open1.err 2>/dev/null || true
            BLOCKS=yes
          else
            echo "RESULT-1: 거부됐다 — 아래가 사용자가 보게 되는 것이다."
            cat open1.err 2>/dev/null || true
            BLOCKS=yes
          fi
          echo "MAC_QUARANTINE_BLOCKS=$BLOCKS" >> "$GITHUB_ENV"

          # ── ② 우리가 안내할 우회법이 실제로 통하는가 ─────────────────────
          if [ "$BLOCKS" = "no" ]; then
            echo "RESULT-2: ①에서 이미 열렸으므로 우회 안내 자체가 불필요하다."
            exit 0
          fi
          echo "== xattr -cr 로 우회한 뒤 다시 열기 =="
          make_copy
          add_quarantine
          xattr -cr "$WORK/Vibisual.app"
          echo "== 속성 제거 후 =="
          xattr -l "$WORK/Vibisual.app" 2>/dev/null | head -3 || echo "   (남은 속성 없음)"
          try_open open2.err
          if [ "$OPENED" = "yes" ]; then
            echo "RESULT-2: xattr -cr 후 정상 실행 — **이 안내는 유효하다.**"
            exit 0
          fi
          echo "RESULT-2: xattr -cr 로도 열리지 않는다 (stalled=$STALLED)."
          cat open2.err 2>/dev/null || true
          echo "::error::README 에 'xattr -cr' 를 우회법으로 적으면 안 된다 — 통하지 않는다"
          exit 1

      # ── Windows (기준선) ───────────────────────────────────────────────
      # 넷 중 셋이 죽고 win 만 산다면 산출물 문제, 넷 다 죽으면 앱 자체 문제 — 해석의 기준점이다.
      - name: Windows — download, install, run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir artifact
          $setup = (Get-ChildItem artifact\*-setup.exe)[0].FullName
          # oneClick + perMachine:false → 사용자 폴더에 무인 설치(관리자 권한 불필요).
          # ⚠️ `-Wait` 을 믿고 곧바로 조회하면 안 된다. NSIS 는 자신을 임시 폴더로 복제해 이어서
          #    실행하는 일이 있어 **원본 프로세스가 먼저 반환**되고, 파일 배치는 그 뒤에 끝난다.
          #    run #1·#2 의 win 실패가 이 자리였다(고정 20초 대기로도 모자랐다) — 그래서 시간이
          #    아니라 **결과가 나타날 때까지** 기다린다. 종료 코드도 남긴다(0 이 아니면 설치 자체가
          #    거절된 것이라 그 뒤 탐색은 의미가 없다).
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"

          function Find-VibisualExe {
            # ① 관례 경로 → ② 레지스트리(가장 확실: NSIS 가 UninstallString 에 설치 폴더를 적는다)
            foreach ($c in @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Vibisual\Vibisual.exe'),
              (Join-Path $env:ProgramFiles 'Vibisual\Vibisual.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Vibisual\Vibisual.exe')
            )) { if ($c -and (Test-Path $c)) { return $c } }
            foreach ($root in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                                'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
              $reg = Get-ItemProperty $root -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -like '*Vibisual*' } | Select-Object -First 1
              if ($reg) {
                # InstallLocation 은 비어 있을 수 있다(실측). UninstallString 의 폴더가 곧 설치 폴더다.
                $dir = $reg.InstallLocation
                if (-not $dir -and $reg.UninstallString) {
                  $dir = Split-Path -Parent ($reg.UninstallString -replace '^"' -replace '"\s.*$' -replace '"$')
                }
                if ($dir) {
                  $cand = Join-Path $dir 'Vibisual.exe'
                  if (Test-Path $cand) { return $cand }
                }
              }
            }
            return $null
          }

          $exe = $null
          for ($i = 0; $i -lt 60; $i++) {
            $exe = Find-VibisualExe
            if ($exe) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $exe) {
            Write-Host "::error::설치본을 못 찾았다 (installer exit=$($p.ExitCode)) — 아래는 진단이다"
            Write-Host "== %LOCALAPPDATA%\Programs =="
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "   $_" }
            Write-Host "== Uninstall 레지스트리(Vibisual) =="
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                             'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like '*Vibisual*' } |
              Select-Object DisplayName, InstallLocation, UninstallString | Format-List | Out-String | Write-Host
            Write-Host "== Vibisual.exe 탐색(사용자 폴더) =="
            Get-ChildItem $env:USERPROFILE -Filter 'Vibisual.exe' -Recurse -Depth 6 -ErrorAction SilentlyContinue |
              Select-Object -First 5 -ExpandProperty FullName | ForEach-Object { Write-Host "   $_" }
            exit 1
          }
          Write-Host "설치 위치: $exe"
          # 인스톨러가 앱을 자동 실행(runAfterFinish)했을 수 있으므로 먼저 정리하고 우리가 띄운다.
          Get-Process Vibisual -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "::error::앱이 25초 안에 죽었다 (exit=$($p.ExitCode))"
            exit 1
          }
          Write-Host "OK — 25초 생존. 앱이 떴다."
          Stop-Process -Id $p.Id -Force

  # ── 발행(공개) — **여기가 유일한 공개 전환점이다** ──────────────────────────
  #
  # 자산은 draft 로 올라온다(`electron-builder.yml` 의 `releaseType: draft`). draft 인 동안에는
  # 업데이터가 피드를 읽지 못하므로 **어떤 설치본에도 도달하지 않는다.** 위 4종 러너가 전부
  # 통과하고 자산 11종이 다 있을 때만 이 잡이 draft 를 해제한다 — 공개는 검증의 결과다.
  #
  # 이 게이트가 없던 시절이 정확히 v0.1.19 다: 태그를 미는 순간 공개 발행이 끝났고 "설치가
  # 되는가"는 그 **뒤에** 쟀다. Windows 인스톨러가 0xC0000005 로 죽은 것을 알았을 때 자산은
  # 이미 공개였고, 설치본은 그것을 받아 실패하는 상태였다. 결함이 아니라 순서가 원인이었다.
  publish:
    needs: smoke
    # `success()` 는 매트릭스 4종이 **전부** 통과했을 때만 참이다(fail-fast:false 여도 그렇다 —
    # 그 옵션은 "형제를 취소하지 않는다"일 뿐 결론을 바꾸지 않는다).
    #
    # 자동 경로는 **릴리스가 띄운 회차일 때만**이다. 옛 태그를 손으로 검증하다가 그 옛 릴리스가
    # 실수로 공개되는 일이 없어야 한다. 스모크에 막혀 draft 로 남은 것을 고친 뒤 되살릴 때는
    # `publish: true` 를 켜서 부른다(그게 그 손잡이의 존재 이유다).
    if: >-
      success() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
       || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.workflow_run.head_branch }}"; fi
          case "$TAG" in v*) ;; *) TAG="" ;; esac
          if [ -z "$TAG" ]; then
            # 위 smoke 잡과 같은 이유로 `gh release view` ❌ — draft 를 건너뛴다.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "발행 대상 태그: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 실행이 되는 것과 **세 OS 에 다 도달하는 것**은 다른 문제다. 스모크는 4종 러너에서
      # 앱이 뜨는지만 보므로, 자산 한 종이 통째로 빠진 것(v0.1.12 의 Intel dmg)은 못 잡는다.
      # 공개 직전에 세는 이유가 그것이다 — 여기서 걸리면 릴리스는 draft 로 남는다.
      - name: 자산 11종 검사 (한 종이라도 없으면 공개하지 않는다)
        shell: bash
        run: node .github/scripts/check-release-assets.mjs "$TAG"

      - name: draft 해제 — 공개 발행
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "공개 발행됨: $TAG"
          echo "이제부터 설치된 앱이 이 판올림을 감지한다(피드가 공개로 열렸다)."
