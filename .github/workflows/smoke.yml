# 발행된 **릴리스 산출물이 그 OS 에서 실제로 실행되는가**를 재는 워크플로.
#
# ⚠️ ci.yml 과 재는 것이 다르다. ci.yml 은 "소스가 이 OS 에서 성립하는가"(typecheck + test)만 본다.
#    그게 초록이어도 사용자에게는 안 되는 앱일 수 있다 — dmg 가 Gatekeeper 에 막히거나, 네이티브
#    모듈이 아키텍처와 어긋나 창이 뜨기도 전에 죽으면 소스는 아무 잘못이 없는데 앱은 실행 불가다.
#    그 구간은 **빌드가 아니라 실행으로만** 드러난다.
#
#    실제로 겪은 일이다(멀티플랫폼 정본 §2.4): 한 러너에서 두 아키텍처를 함께 뽑은 x64 dmg 는
#    `koffi` 가 제 바이너리를 못 찾아 main 프로세스가 뜨자마자 죽었다 — **빌드는 초록, 앱은 실행 불가.**
#    그런 것을 잡으라고 있는 워크플로다.
#
# 수동 실행 전용(workflow_dispatch)이다. 태그마다 자동으로 돌리지 않는 이유는 이 워크플로가 재는 것이
# 소스가 아니라 **그 순간 발행된 파일**이라, 어떤 릴리스를 볼지 골라서 돌리는 편이 쓸모 있기 때문이다.
#
# 판정 신호는 "25초 뒤에도 살아 있는가" 하나다. 위의 즉사류 결함은 전부 기동 직후에 드러나므로
# 이 한 줄로 충분하고, 죽었으면 stdout/stderr 를 그대로 뱉어 원인을 남긴다.

name: Smoke (installed app)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '검증할 릴리스 태그 (비우면 최신 릴리스)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      # 한 OS 가 넘어져도 나머지를 봐야 한다 — "mac 만 죽나, 넷 다 죽나"가 원인 분류의 첫 갈림길이다.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64 (AppImage)
          # mac 은 아키텍처마다 그 아키텍처의 러너에서 **실행까지** 해 봐야 의미가 있다.
          # arm64 러너에서 x64 dmg 를 돌리면 Rosetta 가 덮어 주어 Intel 실기의 진실이 가려진다.
          - os: macos-latest
            label: mac-arm64 (dmg)
          - os: macos-15-intel
            label: mac-x64 (dmg)
          - os: windows-latest
            label: win-x64 (nsis)
    runs-on: ${{ matrix.os }}
    name: smoke (${{ matrix.label }})
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 러너의 ~/.claude/settings.json 을 건드리지 않는다(README 의 opt-out). 우리가 재려는 것은
      # "앱이 뜨고 살아 있는가"이지 훅 설치가 아니다 — 부작용을 줄여 실패 원인을 좁힌다.
      VIBISUAL_SKIP_HOOK_INSTALL: '1'

    steps:
      # ── 검증할 태그 확정 ────────────────────────────────────────────────
      - name: Resolve tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "검증 대상 태그: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # ── Linux ──────────────────────────────────────────────────────────
      - name: Linux — download AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --dir artifact
          ls -la artifact

      # ── ① 실사용자 경로: AppImage 를 **그대로** 실행 ────────────────────
      # 사용자는 `--appimage-extract` 를 하지 않는다. 받아서 실행 권한 주고 더블클릭한다.
      # 그 경로는 AppImage type2 런타임이 FUSE 를 요구하는데, 요즘 우분투에는 기본으로 없다.
      # 아래 두 스텝이 재는 것은 앱이 아니라 **사용자가 그 앱을 열 수 있는가**다.
      - name: Linux — 실사용자 재현 (AppImage 를 그대로 실행)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null   # 러너에 디스플레이가 없다
          echo "== FUSE 관련 패키지 설치 상태(러너 기본) =="
          dpkg -l | grep -iE "libfuse|fuse3?" | awk '{print "   " $2 " " $3}' | head -5 || echo "   (없음)"
          cd artifact
          chmod +x ./*.AppImage
          echo "== 그대로 실행 =="
          xvfb-run -a ./*.AppImage --no-sandbox > direct.log 2>&1 &
          DPID=$!
          sleep 20
          if kill -0 "$DPID" 2>/dev/null; then
            echo "RESULT: FUSE 를 따로 깔지 않아도 AppImage 가 그대로 실행된다 — 사용자는 chmod +x 만 하면 된다."
            kill "$DPID" 2>/dev/null || true
            echo "APPIMAGE_NEEDS_FUSE=no" >> "$GITHUB_ENV"
          else
            echo "RESULT: 그대로는 실행되지 않는다 — 아래가 사용자가 보게 되는 것이다."
            tail -25 direct.log || true
            echo "APPIMAGE_NEEDS_FUSE=yes" >> "$GITHUB_ENV"
          fi
          # ⚠️ 여기서 실패해도 잡을 죽이지 않는다. 이건 앱 결함이 아니라 **포장 형식의 전제**이고,
          #    우리가 알아야 하는 것은 "그래서 README 에 무엇을 적어야 하는가"다. 다음 스텝이 답한다.

      - name: Linux — 안내가 통하는지 (libfuse2 설치 후 재시도)
        if: runner.os == 'Linux' && env.APPIMAGE_NEEDS_FUSE == 'yes'
        shell: bash
        run: |
          set -uo pipefail
          # 우분투 24.04 는 패키지명이 libfuse2t64, 22.04 는 libfuse2 다. 둘 다 시도한다 —
          # README 에 적을 안내가 **실제로 통하는지** 확인하는 자리이므로 여기서 실패하면 진짜 문제다.
          sudo apt-get install -y -qq libfuse2t64 >/dev/null 2>&1 || sudo apt-get install -y -qq libfuse2 >/dev/null 2>&1 || true
          dpkg -l | grep -iE "libfuse2" | awk '{print "   설치됨: " $2 " " $3}' | head -3
          cd artifact
          xvfb-run -a ./*.AppImage --no-sandbox > fuse.log 2>&1 &
          FPID=$!
          sleep 20
          if kill -0 "$FPID" 2>/dev/null; then
            echo "RESULT: libfuse2 를 깔면 정상 실행된다 — 그 안내는 유효하다."
            kill "$FPID" 2>/dev/null || true
          else
            echo "::error::libfuse2 를 깔아도 실행되지 않는다 — README 안내를 그대로 쓰면 안 된다"
            tail -30 fuse.log || true
            exit 1
          fi

      # ── ② 앱 자체 검증: 포장 변수를 없애고 실행 ─────────────────────────
      - name: Linux — run
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          # 위 ①이 포장(FUSE)까지 포함한 사용자 경로라면, 이 스텝은 그 변수를 걷어내고
          # **앱 자신이 도는가**만 격리해서 잰다. 둘이 갈리면 원인이 어느 쪽인지 바로 안다.
          # (xvfb 는 ① 에서 설치했다.)
          cd artifact
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          # ⚠️ AppRun 은 자기 위치를 **환경변수 APPDIR 로 받는다.** AppImage 를 그대로 실행하면
          #    런타임이 그것을 채워 주지만, --appimage-extract 로 풀어서 직접 부르면 비어 있어
          #    `/<실행파일>` 이라는 루트 경로를 찾다 죽는다 — 1차 실측(run #1)에서 정확히
          #    `./squashfs-root/AppRun: line 45: /@vibisualdesktop: No such file or directory` 였다.
          #    앱 결함이 아니라 실행 방법의 결함이므로 APPDIR 를 채워 준다.
          #    (실행 파일명이 `@vibisualdesktop` 인 것은 electron-builder 가 `executableName`
          #     미지정 시 package.json 의 `@vibisual/desktop` 에서 파생하기 때문이다.)
          export APPDIR="$PWD/squashfs-root"
          # Electron 의 SUID 샌드박스는 CI 러너에서 자주 막힌다 — 앱 결함과 뒤섞이지 않게 끈다.
          xvfb-run -a "$APPDIR/AppRun" --no-sandbox > run.log 2>&1 &
          APP_PID=$!
          sleep 25
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "OK — 25초 생존. 앱이 떴다."
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "::error::앱이 25초 안에 죽었다"
            echo "── run.log ──"; tail -80 run.log || true
            exit 1
          fi

      # ── macOS ──────────────────────────────────────────────────────────
      - name: macOS — download dmg (아키텍처에 맞는 것만)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 파일명 규약: arm64 는 `-arm64.dmg`, Intel 은 접미사 없는 `.dmg`.
          # 아키텍처가 어긋난 dmg 를 집으면 그것이야말로 이 워크플로가 잡으려는 즉사 사고다.
          if [ "$(uname -m)" = "arm64" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-arm64.dmg' --dir artifact
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir artifact
            rm -f artifact/*-arm64.dmg
          fi
          ls -la artifact

      - name: macOS — 서명·Gatekeeper 실측 (정보 수집, 실패시키지 않음)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          hdiutil attach -nobrowse -quiet artifact/*.dmg
          APP=$(ls -d /Volumes/Vibisual*/Vibisual.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::error::dmg 안에서 Vibisual.app 을 못 찾았다"; ls -la /Volumes || true; exit 1; fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "== codesign =="
          codesign -dv --verbose=4 "$APP" 2>&1 | head -25 || true
          echo "== spctl (Gatekeeper 평가) =="
          # 미서명이면 여기서 rejected 가 난다. 그건 이미 아는 사실이라 잡을 실패로 삼지 않고
          # **문구를 그대로 남긴다** — 사용자가 첫 실행에서 무엇을 보게 되는지가 이 줄에 있다.
          spctl -a -t exec -vv "$APP" 2>&1 | head -10 || true

      - name: macOS — launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          arch -"$(uname -m)" "$APP/Contents/MacOS/Vibisual" > run.log 2>&1 &
          APP_PID=$!
          sleep 25
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "OK — 25초 생존. 앱이 떴다."
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "::error::앱이 25초 안에 죽었다 (아키텍처 불일치·네이티브 모듈·서명 거부 등)"
            echo "── run.log ──"; tail -80 run.log || true
            exit 1
          fi

      # ── 실사용자 재현: quarantine 이 붙은 채로 여는 것 ──────────────────
      # ⚠️ 위 launch 는 두 가지 이유로 **사용자 경험이 아니다**:
      #    ① 터미널에서 바이너리를 직접 부르면 Gatekeeper 가 개입하지 않는다(LaunchServices 를 안 탄다).
      #    ② 러너는 `gh`(=curl)로 받아 **quarantine 속성이 안 붙는다** — 그 속성은 브라우저가 붙인다.
      #    실제 사용자는 브라우저로 받아 Finder 로 여니 두 조건이 동시에 성립한다. 그래서 여기서는
      #    속성을 직접 붙이고 `open` 으로 연다. 이 스텝이 답하는 질문은 "앱이 도는가"가 아니라
      #    **"사용자가 이 앱을 열 수 있는가"** 다.
      - name: macOS — 실사용자 재현 (quarantine 부착 후 open)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/qtest"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cp -R "$APP" "$WORK/Vibisual.app"
          # Safari 가 붙이는 것과 같은 형식: 플래그;시각(hex);에이전트;UUID
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$WORK/Vibisual.app"
          echo "== 부착된 quarantine =="
          xattr -p com.apple.quarantine "$WORK/Vibisual.app" 2>&1 || true
          echo "== spctl 평가 =="
          spctl -a -t exec -vv "$WORK/Vibisual.app" 2>&1 | head -5 || true
          echo "== open 으로 열기 (사용자가 하는 방식) =="
          OPENED=no
          if open "$WORK/Vibisual.app" 2> open.err; then
            sleep 15
            if pgrep -f "qtest/Vibisual.app/Contents/MacOS" >/dev/null 2>&1; then OPENED=yes; fi
          fi
          if [ "$OPENED" = "yes" ]; then
            echo "RESULT: quarantine 이 붙어도 열린다 — 사용자는 우회 없이 실행할 수 있다."
            pkill -f "qtest/Vibisual.app/Contents/MacOS" 2>/dev/null || true
            echo "MAC_QUARANTINE_BLOCKS=no" >> "$GITHUB_ENV"
          else
            echo "RESULT: 막힌다 — 아래가 사용자가 보게 되는 것이다."
            cat open.err 2>/dev/null || true
            echo "MAC_QUARANTINE_BLOCKS=yes" >> "$GITHUB_ENV"
          fi
          # 여기서 잡을 죽이지 않는다 — 미서명은 **이미 아는 상태**이고, 재려는 것은 그 결과다.
          # "그래서 무엇을 안내할 것인가"는 다음 스텝이 확정한다.

      - name: macOS — 안내가 통하는지 (xattr -cr 후 다시 open)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/qtest"
          # README 에 적을 우회법이 **실제로 통하는지** 확인하는 자리다. 통하지 않는 안내는 안내가 아니다.
          xattr -cr "$WORK/Vibisual.app"
          echo "== 속성 제거 후 =="
          xattr -l "$WORK/Vibisual.app" 2>/dev/null | head -3 || echo "   (남은 속성 없음)"
          OPENED=no
          if open "$WORK/Vibisual.app" 2> open2.err; then
            sleep 15
            if pgrep -f "qtest/Vibisual.app/Contents/MacOS" >/dev/null 2>&1; then OPENED=yes; fi
          fi
          if [ "$OPENED" = "yes" ]; then
            echo "RESULT: xattr -cr 후 정상 실행 — 이 안내는 유효하다."
            pkill -f "qtest/Vibisual.app/Contents/MacOS" 2>/dev/null || true
            exit 0
          fi
          echo "::error::xattr -cr 로도 열리지 않는다 — README 에 그 안내를 쓰면 안 된다"
          cat open2.err 2>/dev/null || true
          exit 1

      # ── Windows (기준선) ───────────────────────────────────────────────
      # 넷 중 셋이 죽고 win 만 산다면 산출물 문제, 넷 다 죽으면 앱 자체 문제 — 해석의 기준점이다.
      - name: Windows — download, install, run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir artifact
          $setup = (Get-ChildItem artifact\*-setup.exe)[0].FullName
          # oneClick + perMachine:false → 사용자 폴더에 무인 설치(관리자 권한 불필요).
          # ⚠️ `-Wait` 을 믿고 곧바로 조회하면 안 된다. NSIS 는 자신을 임시 폴더로 복제해 이어서
          #    실행하는 일이 있어 **원본 프로세스가 먼저 반환**되고, 파일 배치는 그 뒤에 끝난다.
          #    run #1·#2 의 win 실패가 이 자리였다(고정 20초 대기로도 모자랐다) — 그래서 시간이
          #    아니라 **결과가 나타날 때까지** 기다린다. 종료 코드도 남긴다(0 이 아니면 설치 자체가
          #    거절된 것이라 그 뒤 탐색은 의미가 없다).
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"

          function Find-VibisualExe {
            # ① 관례 경로 → ② 레지스트리(가장 확실: NSIS 가 UninstallString 에 설치 폴더를 적는다)
            foreach ($c in @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Vibisual\Vibisual.exe'),
              (Join-Path $env:ProgramFiles 'Vibisual\Vibisual.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Vibisual\Vibisual.exe')
            )) { if ($c -and (Test-Path $c)) { return $c } }
            foreach ($root in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                                'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
              $reg = Get-ItemProperty $root -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -like '*Vibisual*' } | Select-Object -First 1
              if ($reg) {
                # InstallLocation 은 비어 있을 수 있다(실측). UninstallString 의 폴더가 곧 설치 폴더다.
                $dir = $reg.InstallLocation
                if (-not $dir -and $reg.UninstallString) {
                  $dir = Split-Path -Parent ($reg.UninstallString -replace '^"' -replace '"\s.*$' -replace '"$')
                }
                if ($dir) {
                  $cand = Join-Path $dir 'Vibisual.exe'
                  if (Test-Path $cand) { return $cand }
                }
              }
            }
            return $null
          }

          $exe = $null
          for ($i = 0; $i -lt 60; $i++) {
            $exe = Find-VibisualExe
            if ($exe) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $exe) {
            Write-Host "::error::설치본을 못 찾았다 (installer exit=$($p.ExitCode)) — 아래는 진단이다"
            Write-Host "== %LOCALAPPDATA%\Programs =="
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "   $_" }
            Write-Host "== Uninstall 레지스트리(Vibisual) =="
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                             'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like '*Vibisual*' } |
              Select-Object DisplayName, InstallLocation, UninstallString | Format-List | Out-String | Write-Host
            Write-Host "== Vibisual.exe 탐색(사용자 폴더) =="
            Get-ChildItem $env:USERPROFILE -Filter 'Vibisual.exe' -Recurse -Depth 6 -ErrorAction SilentlyContinue |
              Select-Object -First 5 -ExpandProperty FullName | ForEach-Object { Write-Host "   $_" }
            exit 1
          }
          Write-Host "설치 위치: $exe"
          # 인스톨러가 앱을 자동 실행(runAfterFinish)했을 수 있으므로 먼저 정리하고 우리가 띄운다.
          Get-Process Vibisual -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "::error::앱이 25초 안에 죽었다 (exit=$($p.ExitCode))"
            exit 1
          }
          Write-Host "OK — 25초 생존. 앱이 떴다."
          Stop-Process -Id $p.Id -Force
