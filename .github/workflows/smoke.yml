# 발행된 릴리스 산출물이 그 OS 에서 실제로 실행되는가를 잰다. ci.yml(typecheck + test)이 초록이어도 dmg 가 Gatekeeper 에
# 막히거나 네이티브 모듈이 아키텍처와 어긋나(x64 dmg 의 `koffi`, 멀티플랫폼 정본 §2.4) 뜨자마자 죽을 수 있다 — 실행으로만 드러난다.
# 릴리스가 끝나면 자동으로(workflow_run), 수동으로도 돈다. 수동 전용으로 되돌리지 마라 — 결함이 배포된 뒤에야 발견된다.
# ⚠️ release.yml 안에서 `gh workflow run` 으로 부르지 마라 — GITHUB_TOKEN 이 일으킨 이벤트는 새 워크플로를 띄우지 않는다.
# 판정 신호는 "25초 뒤에도 살아 있는가" — 즉사류 결함은 기동 직후에 드러난다. 죽었으면 stdout/stderr 를 남긴다.

name: Smoke (installed app)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '검증할 릴리스 태그 (비우면 최신 릴리스)'
        required: false
        default: ''
      publish:
        description: '통과하면 draft 를 해제해 공개 발행한다 (스모크가 막아 draft 로 남은 릴리스를 고친 뒤 되살리는 손잡이)'
        type: boolean
        required: false
        default: false
  # 릴리스 빌드가 끝난 뒤에 돈다. `release: [published]` 는 안 된다 — 첫 잡이 릴리스를 만드는 순간 발화해 나머지 자산이 아직 없다.
  workflow_run:
    workflows: ['Release']
    types: [completed]

# `write` — 이 워크플로가 공개 발행의 유일한 스위치다(아래 `publish` 잡). draft 는 여기서 실기 검증을 통과해야 공개된다.
permissions:
  contents: write
  # 릴리스 런의 설치본 아티팩트 교차 조회에 필요하다 — 없으면 조용히 릴리스 자산 폴백으로 떨어져 공개 다운로드 수가 오염된다.
  actions: read

jobs:
  smoke:
    strategy:
      # 한 OS 가 넘어져도 나머지를 본다 — "mac 만 죽나, 넷 다 죽나"가 원인 분류의 첫 갈림길이다.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64 (AppImage)
            artifact: installer-linux-x64
          # mac 은 아키텍처마다 그 러너에서 실행한다 — arm64 러너에서 x64 dmg 를 돌리면 Rosetta 가 Intel 실기 결함을 가린다.
          - os: macos-latest
            label: mac-arm64 (dmg)
            artifact: installer-mac-arm64
          - os: macos-15-intel
            label: mac-x64 (dmg)
            artifact: installer-mac-x64
          - os: windows-latest
            label: win-x64 (nsis)
            artifact: installer-win-x64
    runs-on: ${{ matrix.os }}
    name: smoke (${{ matrix.label }})
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 러너의 ~/.claude/settings.json 을 건드리지 않는다(README 의 opt-out) — 재는 것은 앱 기동이지 훅 설치가 아니다.
      VIBISUAL_SKIP_HOOK_INSTALL: '1'

    steps:
      - name: Resolve tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          # 자동 회차면 그 릴리스 런의 태그(태그 push 런의 `head_branch`)를 쓴다. 손으로 dispatch 한 런은 브랜치 이름이라 v 로 시작하는지 본다.
          if [ -z "$TAG" ]; then TAG="${{ github.event.workflow_run.head_branch }}"; fi
          case "$TAG" in v*) ;; *) TAG="" ;; esac
          if [ -z "$TAG" ]; then
            # ⚠️ `gh release view` 를 쓰지 마라 — draft 를 건너뛰어 한 판 옛것을 검증한다. `gh release list` 는 draft 도 준다.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
            echo "태그를 못 받아 최신 릴리스(draft 포함)로 떨어졌다."
          fi
          echo "검증 대상 태그: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          # 아티팩트를 받으려면 그것을 지은 릴리스 런 id 가 필요하다 — 손으로 돌린 회차면 그 태그로 돈 Release 런을 `--branch <태그>` 로 찾는다.
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
                       --branch "$TAG" --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          fi
          echo "설치본을 가져올 릴리스 런: ${RUN_ID:-(못 찾음 — 릴리스 자산으로 떨어진다)}"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 설치본 확보 — ⚠️ 릴리스 자산(`gh release download`)을 기본 경로로 되돌리지 마라. 그 다운로드는 공개 다운로드 수
      # (사이트의 "설치 수")에 잡힌다. 같은 파일을 release.yml `Upload installers for smoke` 아티팩트로 받는다.
      - name: Fetch installers (artifact)
        id: installers
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact
          run-id: ${{ env.RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 아티팩트 만료(14일)·릴리스 런 미발견 때의 최후 수단 — 카운터를 올리므로 경고를 남긴다.
      - name: Fetch installers (fallback — 릴리스 자산)
        if: steps.installers.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::아티팩트를 못 받아 릴리스 자산으로 떨어진다 — 이 경로는 공개 다운로드 수를 올린다(런 ${RUN_ID:-미상})."
          mkdir -p artifact
          case "${{ runner.os }}" in
            Linux)
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --dir artifact
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir artifact
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.rpm' --dir artifact
              ;;
            macOS)
              # 파일명 규약: arm64 는 `-arm64.dmg`, Intel 은 접미사 없는 `.dmg` — 어긋난 dmg 를 집으면 안 된다.
              if [ "$(uname -m)" = "arm64" ]; then
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-arm64.dmg' --dir artifact
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-arm64-mac.zip' --dir artifact
              else
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir artifact
                rm -f artifact/*-arm64.dmg
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-mac.zip' --dir artifact
                rm -f artifact/*-arm64-mac.zip
              fi
              ;;
            Windows)
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe' --dir artifact
              ;;
          esac

      - name: 확보한 설치본
        shell: bash
        run: ls -la artifact

      # ── Linux
      # GitHub 러너에 이미 깔린 라이브러리가 Depends 누락을 가리지 못하게 최소 이미지에서도 설치한다.
      # 검증기는 설치된 Electron의 Node 모드로 실행하므로 별도 Node/GUI 패키지가 의존성을 채우지 않는다.
      - name: Linux — 깨끗한 Ubuntu DEB 의존성과 네이티브 모듈
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e RUNNER_TEMP=/tmp -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/artifact:/artifact:ro" \
            -v "$PWD/.github/scripts/installed-smoke.cjs:/installed-smoke.cjs:ro" \
            ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y /artifact/*.deb
              ELECTRON_RUN_AS_NODE=1 /opt/Vibisual/vibisual /installed-smoke.cjs native /opt/Vibisual/resources x64
              echo "RESULT-DEB-DEPS: clean Ubuntu package dependencies and native modules passed"
            '

      # ⓪ 권장 경로 — deb 를 설치해서 그냥 실행한다. 통하면 "libfuse2 를 까세요" 같은 안내가 필요 없다.
      - name: Linux — 실사용자 재현 (deb 설치 → 그냥 실행)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debpkg
          cp artifact/*.deb debpkg/
          ls -la debpkg
          # 사용자와 같다 — 받은 파일을 apt 에 넘기면 의존성은 apt 가 끌어온다.
          sudo apt-get update -qq
          if ! sudo apt-get install -y ./debpkg/*.deb; then
            echo "::error::deb 설치 실패 — depends 목록이 이 배포판과 안 맞는다(t64 전환 등)"
            dpkg -I ./debpkg/*.deb | sed -n "1,40p"
            exit 1
          fi
          echo "== 설치 결과 =="
          command -v vibisual || { echo "::error::vibisual 이 PATH 에 없다"; dpkg -L vibisual | head -40; exit 1; }
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          PROFILE="$RUNNER_TEMP/vibisual-smoke-deb"
          node .github/scripts/installed-smoke.cjs prepare /opt/Vibisual/resources "$PROFILE"
          ELECTRON_RUN_AS_NODE=1 /opt/Vibisual/vibisual .github/scripts/installed-smoke.cjs native /opt/Vibisual/resources x64
          xvfb-run -a vibisual "--user-data-dir=$PROFILE" > deb-run.log 2>&1 &
          DPID=$!
          sleep 25
          if kill -0 "$DPID" 2>/dev/null; then
            if ! node .github/scripts/installed-smoke.cjs check "$PROFILE"; then
              tail -80 deb-run.log || true
              exit 1
            fi
            echo "RESULT: deb 는 **아무 것도 따로 깔지 않고** 그대로 실행된다 — 안내문이 필요 없다."
          else
            echo "::error::deb 설치본이 25초 안에 죽었다"
            tail -80 deb-run.log || true
            exit 1
          fi
          # 다음 스텝이 단일 인스턴스 락에 걸리지 않게 트리째 회수한다. `pkill -f vibisual` 로 넓히지 마라 — 작업 디렉터리가
          # 저장소 이름과 같아 그 경로를 cmdline 에 가진 러너 프로세스까지 잡혀 잡이 죽는다.
          kill "$DPID" 2>/dev/null || true
          pkill -f "/opt/Vibisual" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3

      # Ubuntu의 rpm 파일 검사만으로는 dnf 의존성·실행 실패를 찾을 수 없다.
      # Fedora 컨테이너에서 패키지 관리자로 설치하고 일반 사용자로 실행한다.
      - name: Linux — rpm 설치와 실행 (Fedora)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ls artifact/*.rpm >/dev/null
          mkdir -p "$RUNNER_TEMP/vibisual-rpm-diagnostics"
          docker run --rm \
            -e GITHUB_ACTIONS=true -e RUNNER_TEMP=/tmp -e VIBISUAL_SKIP_HOOK_INSTALL=1 \
            -v "$PWD/artifact:/artifact:ro" \
            -v "$PWD/.github/scripts/installed-smoke.cjs:/installed-smoke.cjs:ro" \
            -v "$RUNNER_TEMP/vibisual-rpm-diagnostics:/diagnostics" \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              capture() {
                cp /tmp/rpm-run.log /diagnostics/ 2>/dev/null || true
                for name in logs Crashpad; do
                  if [ -d "/tmp/vibisual-smoke-rpm/$name" ]; then
                    cp -R "/tmp/vibisual-smoke-rpm/$name" /diagnostics/ || true
                  fi
                done
              }
              trap capture EXIT
              dnf -y install /artifact/*.rpm
              dnf -y install xorg-x11-server-Xvfb xorg-x11-xauth nodejs shadow-utils util-linux
              useradd --create-home smoke
              runuser -u smoke -- node /installed-smoke.cjs prepare /opt/Vibisual/resources /tmp/vibisual-smoke-rpm
              runuser -u smoke -- env ELECTRON_RUN_AS_NODE=1 /opt/Vibisual/vibisual /installed-smoke.cjs native /opt/Vibisual/resources x64
              # Docker의 user namespace 제약만 우회한다. root 실행은 하지 않는다.
              runuser -u smoke -- xvfb-run -a vibisual --no-sandbox --user-data-dir=/tmp/vibisual-smoke-rpm > /tmp/rpm-run.log 2>&1 &
              pid=$!
              sleep 25
              if ! kill -0 "$pid" 2>/dev/null; then cat /tmp/rpm-run.log; exit 1; fi
              if ! node /installed-smoke.cjs check /tmp/vibisual-smoke-rpm; then
                cat /tmp/rpm-run.log
                exit 1
              fi
              echo "RESULT-RPM: Fedora dnf install, native modules, backend and renderer passed"
            '

      # ① 아래부터는 AppImage 경로 — deb/rpm 이 안 통하는 배포판(Arch·NixOS)용 대체재다.
      - name: Linux — AppImage 확인
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # 파일은 "설치본 확보"가 이미 `artifact/` 에 놓았다.
          ls artifact/*.AppImage >/dev/null || { echo "::error::AppImage 가 없다"; ls -la artifact; exit 1; }

      # ① 실사용자 경로: AppImage 를 그대로 실행(사용자는 `--appimage-extract` 를 안 한다). type2 런타임은 FUSE 를 요구하는데
      # 요즘 우분투엔 기본으로 없다 — 아래 두 스텝은 앱이 아니라 사용자가 그 앱을 열 수 있는가를 잰다.
      - name: Linux — 실사용자 재현 (AppImage 를 그대로 실행)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null   # 러너에 디스플레이가 없다
          echo "== FUSE 관련 패키지 설치 상태(러너 기본) =="
          dpkg -l | grep -iE "libfuse|fuse3?" | awk '{print "   " $2 " " $3}' | head -5 || echo "   (없음)"
          cd artifact
          chmod +x ./*.AppImage
          echo "== 그대로 실행 =="
          xvfb-run -a ./*.AppImage --no-sandbox > direct.log 2>&1 &
          DPID=$!
          sleep 20
          if kill -0 "$DPID" 2>/dev/null; then
            echo "RESULT: FUSE 를 따로 깔지 않아도 AppImage 가 그대로 실행된다 — 사용자는 chmod +x 만 하면 된다."
            echo "APPIMAGE_NEEDS_FUSE=no" >> "$GITHUB_ENV"
          else
            echo "RESULT: 그대로는 실행되지 않는다 — 아래가 사용자가 보게 되는 것이다."
            tail -25 direct.log || true
            echo "APPIMAGE_NEEDS_FUSE=yes" >> "$GITHUB_ENV"
          fi
          # ⚠️ `kill $DPID` 만으로는 부족하다 — `xvfb-run` 의 PID 라 자식인 앱이 살아남고, 단일 인스턴스 락 때문에
          #    다음 스텝의 두 번째 인스턴스가 즉시 종료된다(CI 실측).
          kill "$DPID" 2>/dev/null || true
          pkill -f "@vibisualdesktop" 2>/dev/null || true
          pkill -f "[.]AppImage" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3
          # 여기서 실패해도 잡을 죽이지 않는다 — 앱 결함이 아니라 포장 형식의 전제다. README 안내가 통하는지는 다음 스텝이 잰다.

      - name: Linux — 안내가 통하는지 (libfuse2 설치 후 재시도)
        if: runner.os == 'Linux' && env.APPIMAGE_NEEDS_FUSE == 'yes'
        shell: bash
        run: |
          set -uo pipefail
          # 패키지명은 우분투 24.04 libfuse2t64, 22.04 libfuse2 — 둘 다 시도한다. README 안내를 확인하는 자리라 실패하면 진짜 문제다.
          sudo apt-get install -y -qq libfuse2t64 >/dev/null 2>&1 || sudo apt-get install -y -qq libfuse2 >/dev/null 2>&1 || true
          dpkg -l | grep -iE "libfuse2" | awk '{print "   설치됨: " $2 " " $3}' | head -3
          cd artifact
          xvfb-run -a ./*.AppImage --no-sandbox > fuse.log 2>&1 &
          FPID=$!
          sleep 20
          RC=0
          if kill -0 "$FPID" 2>/dev/null; then
            echo "RESULT: libfuse2 를 깔면 정상 실행된다 — 그 안내는 유효하다."
          else
            echo "::error::libfuse2 를 깔아도 실행되지 않는다 — README 안내를 그대로 쓰면 안 된다"
            tail -30 fuse.log || true
            RC=1
          fi
          # 다음 스텝이 두 번째 인스턴스로 튕기지 않게 트리째 회수한다(위 스텝 주석 참고).
          kill "$FPID" 2>/dev/null || true
          pkill -f "@vibisualdesktop" 2>/dev/null || true
          pkill -f "[.]AppImage" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3
          exit $RC

      # ② 앱 자체 검증: 포장 변수(FUSE)를 없애고 실행 — ① 과 갈리면 원인이 포장인지 앱인지 바로 안다.
      - name: Linux — run
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # xvfb 는 ① 에서 설치했다. 앞 스텝 인스턴스가 남으면 단일 인스턴스 락으로 즉사하므로 들어오며 한 번 더 쓸어낸다.
          pkill -f "@vibisualdesktop" 2>/dev/null || true
          pkill -f "[.]AppImage" 2>/dev/null || true
          pkill -f "chrome_crashpad_handler" 2>/dev/null || true
          sleep 3
          cd artifact
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          # ⚠️ AppRun 은 자기 위치를 APPDIR 로 받는다 — 풀어서 직접 부르면 비어 있어 `/<실행파일>` 루트 경로를 찾다 죽는다
          #    (`AppRun: line 45: /@vibisualdesktop: No such file or directory`). 그래서 채워 준다.
          export APPDIR="$PWD/squashfs-root"
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/installed-smoke.cjs"
          PROFILE="$RUNNER_TEMP/vibisual-smoke-appimage"
          node "$SCRIPT" prepare "$APPDIR/resources" "$PROFILE"
          ELECTRON_RUN_AS_NODE=1 "$APPDIR/vibisual" "$SCRIPT" native "$APPDIR/resources" x64
          # Electron 의 SUID 샌드박스는 CI 러너에서 자주 막힌다 — 앱 결함과 뒤섞이지 않게 끈다.
          xvfb-run -a "$APPDIR/AppRun" --no-sandbox "--user-data-dir=$PROFILE" > run.log 2>&1 &
          APP_PID=$!
          sleep 25
          if kill -0 "$APP_PID" 2>/dev/null; then
            if ! node "$SCRIPT" check "$PROFILE"; then
              tail -80 run.log || true
              exit 1
            fi
            echo "OK — 25초 생존. 앱이 떴다."
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "::error::앱이 25초 안에 죽었다"
            echo "── run.log ──"; tail -80 run.log || true
            exit 1
          fi

      # ── macOS
      - name: macOS — dmg 확인 (아키텍처에 맞는 것만)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 아티팩트가 러너별로 갈려 있어 아키텍처는 저절로 맞지만, 어긋난 dmg 는 즉사 사고라 한 번 더 본다.
          if [ "$(uname -m)" = "arm64" ]; then
            ls artifact/*-arm64.dmg >/dev/null || { echo "::error::arm64 dmg 가 없다"; ls -la artifact; exit 1; }
          else
            rm -f artifact/*-arm64.dmg
            ls artifact/*.dmg >/dev/null || { echo "::error::Intel dmg 가 없다"; ls -la artifact; exit 1; }
          fi
          ls -la artifact

      - name: macOS — 서명·Gatekeeper 실측 (정보 수집, 실패시키지 않음)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          hdiutil attach -nobrowse -quiet artifact/*.dmg
          APP=$(ls -d /Volumes/Vibisual*/Vibisual.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::error::dmg 안에서 Vibisual.app 을 못 찾았다"; ls -la /Volumes || true; exit 1; fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "== codesign =="
          codesign -dv --verbose=4 "$APP" 2>&1 | head -25 || true
          echo "== spctl (Gatekeeper 평가) =="
          # 미서명이면 rejected 가 난다 — 실패로 삼지 않고 문구만 남긴다(사용자가 첫 실행에서 보는 것).
          spctl -a -t exec -vv "$APP" 2>&1 | head -10 || true

      - name: macOS — launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=x64
          if [ "$(uname -m)" = "arm64" ]; then EXPECTED=arm64; fi
          lipo "$APP/Contents/MacOS/Vibisual" -verify_arch "$(uname -m)"
          PROFILE="$RUNNER_TEMP/vibisual-smoke-dmg"
          node .github/scripts/installed-smoke.cjs prepare "$APP/Contents/Resources" "$PROFILE"
          ELECTRON_RUN_AS_NODE=1 arch -"$(uname -m)" "$APP/Contents/MacOS/Vibisual" \
            .github/scripts/installed-smoke.cjs native "$APP/Contents/Resources" "$EXPECTED"
          arch -"$(uname -m)" "$APP/Contents/MacOS/Vibisual" "--user-data-dir=$PROFILE" > run.log 2>&1 &
          APP_PID=$!
          sleep 25
          if kill -0 "$APP_PID" 2>/dev/null; then
            if ! node .github/scripts/installed-smoke.cjs check "$PROFILE"; then
              tail -80 run.log || true
              exit 1
            fi
            echo "OK — 25초 생존. 앱이 떴다."
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "::error::앱이 25초 안에 죽었다 (아키텍처 불일치·네이티브 모듈·서명 거부 등)"
            echo "── run.log ──"; tail -80 run.log || true
            exit 1
          fi

      - name: macOS — 업데이트 zip 실행 (아키텍처·네이티브·본체 준비)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=x64
          if [ "$(uname -m)" = "arm64" ]; then EXPECTED=arm64; fi
          mkdir -p "$RUNNER_TEMP/zip-app"
          ditto -x -k artifact/*-mac.zip "$RUNNER_TEMP/zip-app"
          ZIP_APP="$RUNNER_TEMP/zip-app/Vibisual.app"
          lipo "$ZIP_APP/Contents/MacOS/Vibisual" -verify_arch "$(uname -m)"
          PROFILE="$RUNNER_TEMP/vibisual-smoke-zip"
          node .github/scripts/installed-smoke.cjs prepare "$ZIP_APP/Contents/Resources" "$PROFILE"
          ELECTRON_RUN_AS_NODE=1 arch -"$(uname -m)" "$ZIP_APP/Contents/MacOS/Vibisual" \
            .github/scripts/installed-smoke.cjs native "$ZIP_APP/Contents/Resources" "$EXPECTED"
          arch -"$(uname -m)" "$ZIP_APP/Contents/MacOS/Vibisual" "--user-data-dir=$PROFILE" > zip-run.log 2>&1 &
          pid=$!
          sleep 25
          if ! kill -0 "$pid" 2>/dev/null; then cat zip-run.log; exit 1; fi
          if ! node .github/scripts/installed-smoke.cjs check "$PROFILE"; then
            tail -80 zip-run.log || true
            exit 1
          fi
          echo "RESULT-ZIP: $EXPECTED update bundle passed"
          kill "$pid" 2>/dev/null || true

      # 실사용자 재현 — `open`(LaunchServices) + quarantine 이라 Gatekeeper 를 탄다(launch 스텝은 직접 실행이라 안 탄다).
      # ⚠️ 반드시 한 스텝 안에서 — revoked 판정 번들을 `open` 하면 macOS 가 격리·이동할 수 있어 스텝을 가르면 사본이 사라진다
      #    (`xattr: No such file`). 매 단계 앞에서 사본을 다시 만든다.
      - name: macOS — 실사용자 재현 (quarantine → open → xattr -cr → 재시도)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/qtest"

          make_copy() {   # 매번 깨끗한 사본 — 앞 단계에서 시스템이 번들을 건드렸을 수 있다
            rm -rf "$WORK"; mkdir -p "$WORK"
            cp -R "$APP" "$WORK/Vibisual.app" || { echo "::error::앱 사본 생성 실패: $APP"; exit 1; }
            [ -d "$WORK/Vibisual.app" ] || { echo "::error::사본이 없다: $WORK/Vibisual.app"; exit 1; }
          }

          add_quarantine() {  # Safari 가 붙이는 것과 같은 형식: 플래그;시각(hex);에이전트;UUID
            xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$WORK/Vibisual.app"
          }

          try_open() {    # `open` 은 경고 다이얼로그에 걸리면 영영 안 돌아온다 → 백그라운드 + 폴링
            OPENED=no; STALLED=no
            open "$WORK/Vibisual.app" >/dev/null 2> "$1" &
            opid=$!
            for _ in $(seq 1 15); do kill -0 "$opid" 2>/dev/null || break; sleep 2; done
            if kill -0 "$opid" 2>/dev/null; then STALLED=yes; kill "$opid" 2>/dev/null || true; fi
            sleep 3
            if pgrep -f "qtest/Vibisual.app/Contents/MacOS" >/dev/null 2>&1; then OPENED=yes; fi
            pkill -f "qtest/Vibisual.app" 2>/dev/null || true
            sleep 2
          }

          # ① 브라우저로 받아 Finder 로 여는 상황
          make_copy
          add_quarantine
          echo "== 부착된 quarantine =="
          xattr -p com.apple.quarantine "$WORK/Vibisual.app" 2>&1 || true
          echo "== spctl 평가 =="
          spctl -a -t exec -vv "$WORK/Vibisual.app" 2>&1 | head -5 || true
          echo "== open (사용자가 하는 방식) =="
          try_open open1.err
          if [ "$OPENED" = "yes" ]; then
            echo "RESULT-1: quarantine 이 붙어도 열린다 — 사용자는 우회 없이 실행할 수 있다."
            BLOCKS=no
          elif [ "$STALLED" = "yes" ]; then
            echo "RESULT-1: open 이 30초간 돌아오지 않았다 — **경고 다이얼로그가 떠서 클릭을 기다리는 상태**다."
            echo "          사용자에게는 '경고창이 뜨고 그냥은 못 연다'로 나타난다."
            cat open1.err 2>/dev/null || true
            BLOCKS=yes
          else
            echo "RESULT-1: 거부됐다 — 아래가 사용자가 보게 되는 것이다."
            cat open1.err 2>/dev/null || true
            BLOCKS=yes
          fi
          echo "MAC_QUARANTINE_BLOCKS=$BLOCKS" >> "$GITHUB_ENV"

          # ② 안내할 우회법(xattr -cr)이 실제로 통하는가
          if [ "$BLOCKS" = "no" ]; then
            echo "RESULT-2: ①에서 이미 열렸으므로 우회 안내 자체가 불필요하다."
            exit 0
          fi
          echo "== xattr -cr 로 우회한 뒤 다시 열기 =="
          make_copy
          add_quarantine
          xattr -cr "$WORK/Vibisual.app"
          echo "== 속성 제거 후 =="
          xattr -l "$WORK/Vibisual.app" 2>/dev/null | head -3 || echo "   (남은 속성 없음)"
          try_open open2.err
          if [ "$OPENED" = "yes" ]; then
            echo "RESULT-2: xattr -cr 후 정상 실행 — **이 안내는 유효하다.**"
            exit 0
          fi
          echo "RESULT-2: xattr -cr 로도 열리지 않는다 (stalled=$STALLED)."
          cat open2.err 2>/dev/null || true
          echo "::error::README 에 'xattr -cr' 를 우회법으로 적으면 안 된다 — 통하지 않는다"
          exit 1

      # ── Windows(기준선) — 셋이 죽고 win 만 살면 산출물 문제, 넷 다 죽으면 앱 자체 문제.
      - name: Windows — install, run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 파일은 위 "설치본 확보"가 이미 `artifact\` 에 놓았다.
          $found = @(Get-ChildItem artifact\*-setup.exe -ErrorAction SilentlyContinue)
          if ($found.Count -eq 0) { Get-ChildItem artifact; throw 'setup.exe 가 없다' }
          $setup = $found[0].FullName
          # oneClick + perMachine:false → 사용자 폴더에 무인 설치(관리자 권한 불필요).
          # ⚠️ `-Wait` 을 믿고 곧바로 조회하지 마라 — NSIS 가 임시 폴더 사본으로 이어 실행해 원본이 먼저 반환된다(고정 20초 대기도
          #    모자랐다). 시간이 아니라 결과가 나타날 때까지 기다린다. 종료 코드가 0 이 아니면 설치 거절이라 탐색이 무의미하다.
          # 러너 하드웨어를 남긴다 — 같은 설치본이 러너에 따라 2초 만에 0xC0000005(exit=-1073741819)로 죽었다(2026-09-13 실측, 스모크 23회 중 4회).
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          Write-Host "runner cpu: $cpu · logical=$([Environment]::ProcessorCount) · os=$([Environment]::OSVersion.VersionString)"
          $installStart = Get-Date
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            # 판정은 그대로(아래에서 실패한다) — 어느 모듈이 죽었는지만 남긴다. Application Error(1000)에 모듈·예외 코드·오프셋,
            # WER(1001)에 버킷이 적힌다.
            Write-Host "== 설치 프로그램 충돌 기록(Application 로그 1000·1001) =="
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001; StartTime = $installStart.AddSeconds(-5) } -ErrorAction SilentlyContinue |
              Select-Object -First 4 | ForEach-Object { Write-Host "---- [$($_.Id)] $($_.TimeCreated.ToString('HH:mm:ss'))"; Write-Host $_.Message }
            Write-Host "== 설치 프로그램이 풀어 둔 플러그인(%TEMP%\ns*.tmp) =="
            Get-ChildItem $env:TEMP -Directory -Filter 'ns*.tmp' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "   $($_.FullName)"
              Get-ChildItem $_.FullName -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "      $($_.Name)  $($_.Length)" }
            }
            throw "설치 프로그램 실패 (exit=$($p.ExitCode))"
          }

          function Find-VibisualExe {
            # ① 관례 경로 → ② 레지스트리(가장 확실: NSIS 가 UninstallString 에 설치 폴더를 적는다)
            foreach ($c in @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Vibisual\Vibisual.exe'),
              (Join-Path $env:ProgramFiles 'Vibisual\Vibisual.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Vibisual\Vibisual.exe')
            )) { if ($c -and (Test-Path $c)) { return $c } }
            foreach ($root in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                                'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
              $reg = Get-ItemProperty $root -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -like '*Vibisual*' } | Select-Object -First 1
              if ($reg) {
                # InstallLocation 은 비어 있을 수 있다(실측). UninstallString 의 폴더가 곧 설치 폴더다.
                $dir = $reg.InstallLocation
                if (-not $dir -and $reg.UninstallString) {
                  $dir = Split-Path -Parent ($reg.UninstallString -replace '^"' -replace '"\s.*$' -replace '"$')
                }
                if ($dir) {
                  $cand = Join-Path $dir 'Vibisual.exe'
                  if (Test-Path $cand) { return $cand }
                }
              }
            }
            return $null
          }

          $exe = $null
          for ($i = 0; $i -lt 60; $i++) {
            $exe = Find-VibisualExe
            if ($exe) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $exe) {
            Write-Host "::error::설치본을 못 찾았다 (installer exit=$($p.ExitCode)) — 아래는 진단이다"
            Write-Host "== %LOCALAPPDATA%\Programs =="
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "   $_" }
            Write-Host "== Uninstall 레지스트리(Vibisual) =="
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                             'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like '*Vibisual*' } |
              Select-Object DisplayName, InstallLocation, UninstallString | Format-List | Out-String | Write-Host
            Write-Host "== Vibisual.exe 탐색(사용자 폴더) =="
            Get-ChildItem $env:USERPROFILE -Filter 'Vibisual.exe' -Recurse -Depth 6 -ErrorAction SilentlyContinue |
              Select-Object -First 5 -ExpandProperty FullName | ForEach-Object { Write-Host "   $_" }
            exit 1
          }
          Write-Host "설치 위치: $exe"
          # 인스톨러가 앱을 자동 실행(runAfterFinish)했을 수 있으므로 먼저 정리하고 우리가 띄운다.
          Get-Process Vibisual -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $profileDir = Join-Path $env:RUNNER_TEMP 'vibisual-smoke-win'
          $resources = Join-Path (Split-Path -Parent $exe) 'resources'
          node .github/scripts/installed-smoke.cjs prepare $resources $profileDir
          if ($LASTEXITCODE -ne 0) { throw '스모크 프로필 준비 실패' }
          $p = Start-Process -FilePath $exe -ArgumentList "`"--user-data-dir=$profileDir`"" -PassThru `
            -RedirectStandardOutput win-run.log -RedirectStandardError win-error.log
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "::error::앱이 25초 안에 죽었다 (exit=$($p.ExitCode))"
            exit 1
          }
          node .github/scripts/installed-smoke.cjs check $profileDir
          if ($LASTEXITCODE -ne 0) { throw '백엔드·본체 준비 확인 실패' }
          Write-Host "OK — 25초 생존. 앱이 떴다."
          Stop-Process -Id $p.Id -Force

      - name: 실패 진단 보존 (stdout, startup, crash dumps)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics-${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            *run.log
            win-error.log
            artifact/direct.log
            artifact/fuse.log
            artifact/run.log
            ${{ runner.temp }}/vibisual-smoke-*/logs/
            ${{ runner.temp }}/vibisual-smoke-*/Crashpad/**/*.dmp
            ${{ runner.temp }}/vibisual-rpm-diagnostics/

  # 발행(공개) — 유일한 공개 전환점. 자산은 draft(`electron-builder.yml` `releaseType: draft`)라 업데이터 피드에 안 잡힌다.
  # 스모크 4종이 전부 통과하고 자산이 다 있을 때만 draft 를 푼다 — 먼저 공개하면 결함이 검증보다 먼저 설치본에 닿는다.
  publish:
    needs: smoke
    # `success()` 는 매트릭스 4종이 전부 통과했을 때만 참이다(fail-fast:false 는 형제를 취소하지 않을 뿐이다).
    # 자동 공개는 릴리스가 띄운 회차만 — 옛 태그를 손으로 검증하다 공개되면 안 된다. 막혔던 draft 는 `publish: true` 로 되살린다.
    if: >-
      success() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
       || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.workflow_run.head_branch }}"; fi
          case "$TAG" in v*) ;; *) TAG="" ;; esac
          if [ -z "$TAG" ]; then
            # 위 smoke 잡과 같은 이유로 `gh release view` ❌ — draft 를 건너뛴다.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "발행 대상 태그: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # draft 의 태그 묶음은 풀릴 수 있다 — `tag_name` 없이 고쳐 보내면 `untagged-<hash>` 로 돌아간다(2026-09-13 확인).
      # 공개로 가는 유일한 문이라 무엇이 풀었든 여기서 다시 묶는다(안 그러면 아래 검사가 릴리스를 못 찾는다).
      - name: draft 가 태그에 묶여 있는지 확인 (풀려 있으면 다시 묶는다)
        shell: bash
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq "[.[] | select(.draft == true and (.tag_name == \"$TAG\" or .name == \"$VER\"))][0].id // empty")
          if [ -z "$ID" ]; then
            echo "$TAG 의 draft 가 없다 — 이미 공개됐거나 아직 안 올라왔다. 판정은 다음 스텝이 한다."
            exit 0
          fi
          BOUND=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .tag_name)
          if [ "$BOUND" = "$TAG" ]; then
            echo "release #$ID 는 $TAG 에 묶여 있다."
            exit 0
          fi
          echo "::warning::release #$ID 의 tag_name 이 $BOUND 다 — $TAG 로 다시 묶는다"
          AFTER=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -f tag_name="$TAG" --jq .tag_name)
          [ "$AFTER" = "$TAG" ] || { echo "::error::release #$ID 를 $TAG 로 묶지 못했다 (tag_name=$AFTER)"; exit 1; }
          echo "다시 묶었다 — release #$ID (tag_name=$AFTER)"

      # 스모크는 앱이 뜨는지만 봐 자산 한 종이 통째로 빠진 것은 못 잡는다 — 공개 직전에 센다(걸리면 draft 로 남는다).
      # 몇 종인지는 여기 적지 않는다 — 목록의 정본은 check-release-assets.mjs 하나다.
      - name: 자산 검사 (한 종이라도 없으면 공개하지 않는다)
        shell: bash
        run: node .github/scripts/check-release-assets.mjs "$TAG"

      - name: draft 해제 — 공개 발행
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "공개 발행됨: $TAG"
          echo "이제부터 설치된 앱이 이 판올림을 감지한다(피드가 공개로 열렸다)."
