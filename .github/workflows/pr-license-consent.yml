# PR 라이선스 동의 확인 — 병합 버튼 위에서 막는다. DCO 서명은 제출할 권리의 확인일 뿐, CONTRIBUTING.md 의 추가 라이선스
# 허락(재라이선스·서브라이선스) 동의가 아니다 — 그것은 PR 템플릿 확인란으로 받고 여기서 검사한다.
# ⚠️ PR 본문은 반드시 `env:` 로 넘긴다 — `run:` 안에 ${{ ... }} 로 박으면 셸 메타문자를 넣은 PR 로 임의 명령이 돈다.
# 판정은 .github/scripts/pr-license-consent.mjs 한 곳(`--selftest` 가 고정). 소유자 본인의 PR 은 통과시킨다.
# 실제로 막으려면 GitHub 설정에서 required status check 로 걸어야 한다 — 안 걸면 붉게 뜨기만 한다.

name: Licensing

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: licensing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  consent:
    # 이 이름이 required status check 의 이름이다 — 바꾸면 설정이 끊긴다.
    name: Licensing consent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 판정 로직 자체 검사
        run: node .github/scripts/pr-license-consent.mjs --selftest

      - name: PR 본문의 동의 확인란 검사
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: node .github/scripts/pr-license-consent.mjs
