# SCENARIO.md §4 v2.44 — 자동 업데이트 릴리스 자동화.
#
# `v*` 태그(예: v0.1.1)를 푸시하면 win/mac/linux 빌드 산출물(setup/dmg/AppImage + latest*.yml
# + blockmap)을 GitHub Releases 에 자동 업로드한다. 그제서야 설치된 앱의 electron-updater 가
# 새 버전을 감지·다운로드한다.
#
# ⚠️ 소스 main 푸시만으로는 릴리스가 만들어지지 않는다 — 반드시 버전 bump 후 태그 푸시:
#     1) packages/desktop/package.json 의 "version" 을 올린다 (예: 0.1.0 → 0.1.1)
#     2) git tag v0.1.1 && git push origin v0.1.1
#   (버전 숫자 0.1.1 은 예시일 뿐, 어떤 값으로 올릴지는 전적으로 사용자가 정한다.)
#
# ⚠️ Windows 미서명 빌드는 자동 업데이트는 동작하나 SmartScreen 경고가 뜬다. macOS 는
#    서명+공증이 없으면 자동 업데이트가 차단된다(현재 코드서명 슬롯 미배선 — SCENARIO §3.7 / task §7).
#    그래도 빌드/발행 자체는 성공한다.
#
# ⚠️ v0.1.0~v0.1.9 의 mac 잡이 전부 실패한 진짜 원인은 서명이 아니라 **아이콘 크기**였다 —
#    `resources/icons/icon.png` 가 256×256 이라 electron-builder 의
#    "image ... must be at least 512x512" 검사에서 죽었다(2026-08-19, v0.1.9 로그 163줄에서 확인).
#    아이콘을 1024×1024 로 재생성해 해소. 서명 탓으로 적어 둔 아래 주석 때문에 10번의 릴리스 동안
#    아무도 로그를 열어보지 않았다 — 실패를 "예상된 것"으로 적어 두면 그 실패는 조사되지 않는다.

# ⚠️ mac 은 **아키텍처마다 그 아키텍처의 러너에서** 짓는다(2026-08-26). 한 러너에서
#    `--arm64 --x64` 를 함께 뽑으면 두 dmg 에 **같은 node_modules** 가 들어가는데, 네이티브
#    모듈 중에는 설치 시점의 플랫폼·아키텍처 것만 깔리는 것이 있다 — `koffi` 가 그렇다
#    (`@koromix/koffi-<platform>-<arch>` optionalDependency 라 arm64 러너에는 darwin-arm64 만
#    깔린다). 그렇게 만든 x64 dmg 를 Intel Mac 에서 열면 `koffi` 가 제 바이너리를 못 찾아
#    **main 프로세스가 뜨자마자 죽는다** — 빌드는 초록, 앱은 실행 불가. 그래서 arm64 는
#    macos-latest, x64 는 macos-15-intel 에서 각각 짓는다(둘 다 공개 저장소 무료 표준 러너).
#    node-pty 는 모든 플랫폼 prebuild 를 한 패키지에 담아 이 문제가 없다 — 판단은 패키지마다.

# ⚠️ mac 잡만 재시도로 감싼다 — `hdiutil: couldn't eject "diskN" - Resource busy` (2026-08-26).
#    v0.1.12 의 x64 잡이 12분 15초를 빌드한 뒤 **마지막 단계**에서 이 오류로 죽었다(arm64 는 같은
#    커밋으로 통과). dmg 를 다 만들고 디스크 이미지를 떼어내는 자리인데, 그 순간 볼륨을 붙들고 있는
#    프로세스가 있으면 detach 가 거절된다. electron-builder 24.13.3 은 이미 `hdiutil detach -force`
#    를 5회 재시도하지만(dmg-builder/out/dmgUtil.js) 그것을 다 소진하고도 실패했다.
#    상류에 수정본이 없는 **간헐 실패**이고(electron-userland/electron-builder#7137 — "rerunning the
#    build generally passes"), 원인이 우리 설정에 없으므로 고칠 자리는 워크플로다. 그래서 mac 잡만
#    최대 3회 재시도하고, 시도 사이에 **붙어 있는 볼륨을 떼고 반쯤 쓰인 dmg 를 지운다** — 죽은 시도가
#    볼륨을 남겨 두면 다음 시도는 같은 자리에서 또 막히므로 재시도 자체가 무의미해진다.
#    win/linux 는 종전 스텝 그대로다(이번 변경으로 동작이 바뀌지 않는다).

name: Release

on:
  push:
    tags:
      - 'v*'
  # 수동 트리거도 허용(태그 없이 테스트 빌드 — draft 로 올라간다).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          # mac 은 **아키텍처마다 그 아키텍처의 러너에서** 짓는다 — 아래 주석 참고.
          - os: macos-latest        # Apple Silicon (arm64)
            script: release:mac:arm64
          - os: macos-15-intel      # Intel (x64)
            script: release:mac:x64
          - os: ubuntu-latest
            script: release:linux
    runs-on: ${{ matrix.os }}
    # continue-on-error 는 걷어냈다(2026-08-26). 이 줄이 걸어 둔 조건 — "mac 이 실제로 초록으로
    # 도는 것을 한 번 확인하면" — 은 v0.1.11 에서 충족됐다(run 32344953534, mac 잡 success).
    # fail-fast: false 라 mac 이 넘어져도 win/linux 발행은 그대로 끝나고, 다만 **런이 빨갛게** 남는다.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rpm 타깃은 러너에 `rpmbuild` 가 있어야 만들어진다(deb 는 dpkg 계열이 기본 탑재).
      # 없으면 electron-builder 가 rpm 만 조용히 건너뛰는 게 아니라 **그 잡 전체가 죽는다.**
      # AppImage 하나만 내보내던 시절에는 필요 없던 스텝이다 — deb/rpm 을 추가한 순간부터 필수.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      # win/linux — 종전 그대로. 여기에 재시도를 걸지 않는 이유는, 이 두 잡의 실패는
      # 지금까지 전부 **결정적 실패**(고쳐야 나가는 것)였기 때문이다. 재시도로 감싸면
      # 같은 실패를 두 번 겪느라 시간만 배로 쓴다.
      - name: Build and publish
        if: runner.os != 'macOS'
        run: pnpm run ${{ matrix.script }}
        env:
          # electron-builder 가 GitHub Releases 에 업로드할 때 쓰는 토큰.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 코드서명 자동 탐색 비활성(미서명 빌드를 실패시키지 않음).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # mac — hdiutil detach 간헐 실패를 재시도로 넘긴다(머리말의 hdiutil 항목 참고).
      - name: Build and publish (macOS — hdiutil 재시도)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          # ── 코드 서명 슬롯 ──────────────────────────────────────────────
          # 인증서 시크릿이 있으면 **서명 + 공증**으로, 없으면 지금까지와 똑같이 미서명으로 짓는다.
          # 미서명 dmg 는 Gatekeeper 가 첫 실행을 막고(실측: `open` 이 다이얼로그를 띄운 채 응답 없음)
          # 사용자가 `xattr -cr` 을 손으로 쳐야 열린다 — 그걸 없애는 유일한 길이 이 서명이다.
          # 서명이 붙으면 자동 업데이트도 notify-only 에서 무인 설치로 승격된다(같은 뿌리).
          # 필요한 시크릿 넷: MAC_CSC_LINK(base64 .p12) · MAC_CSC_KEY_PASSWORD
          #                 · APPLE_ID · APPLE_APP_SPECIFIC_PASSWORD · APPLE_TEAM_ID
          EXTRA=""
          if [ -n "${CSC_LINK:-}" ]; then
            echo "코드 서명 인증서 감지 — 서명해서 짓는다."
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            EXTRA="--config.mac.hardenedRuntime=true --config.mac.gatekeeperAssess=false"
            EXTRA="$EXTRA --config.mac.entitlements=build/entitlements.mac.plist"
            EXTRA="$EXTRA --config.mac.entitlementsInherit=build/entitlements.mac.plist"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              echo "공증 자격증명도 있다 — notarize 까지 간다."
              EXTRA="$EXTRA --config.mac.notarize=true"
            else
              echo "::warning::서명은 되지만 공증 자격증명이 없다 — Gatekeeper 가 여전히 막을 수 있다."
            fi
          else
            echo "::warning::mac 인증서 시크릿이 없다 — 미서명으로 짓는다. 사용자는 첫 실행에 xattr -cr 이 필요하다."
          fi
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "--- attempt $i/$attempts — pnpm run ${{ matrix.script }} $EXTRA"
            if pnpm run ${{ matrix.script }} $EXTRA; then
              exit 0
            fi
            if [ "$i" -eq "$attempts" ]; then
              echo "::error::${{ matrix.script }} failed after $attempts attempts"
              exit 1
            fi
            echo "::warning::attempt $i failed — 붙어 있는 디스크 이미지를 떼고 재시도한다"
            # 죽은 시도가 볼륨을 붙여 둔 채 끝나면 다음 시도는 같은 자리에서 또 막힌다.
            # productName 은 electron-builder.yml 의 `Vibisual` — 볼륨 이름이 그것으로 시작한다.
            for vol in /Volumes/Vibisual*; do
              [ -d "$vol" ] || continue
              echo "detaching $vol"
              hdiutil detach -force "$vol" || diskutil unmount force "$vol" || true
            done
            # 반쯤 쓰인 산출물은 지운다 — 다음 시도가 새로 만든다.
            rm -f packages/desktop/dist/*.dmg packages/desktop/dist/*.dmg.blockmap || true
            # 붙들고 있던 쪽이 손을 뗄 틈을 준다("should go away soon" — #7137).
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 기본은 미서명. 위 스크립트가 CSC_LINK 를 보면 true 로 덮어쓴다.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
