# SCENARIO.md §4 — `v*` 태그를 푸시하면 win/mac/linux 산출물(+ latest*.yml·blockmap)을 GitHub Releases 에 올린다 — 설치된 앱의 electron-updater 가 그것을 본다.
# ⚠️ main 푸시만으로는 릴리스가 안 생긴다: packages/desktop/package.json 의 "version" 을 올린 뒤 그 태그를 푸시한다.
# ⚠️ Windows 미서명은 SmartScreen 경고가 뜬다. mac 은 미서명이라 업데이트를 앱이 직접 받아 교체한다(`macSelfInstall.ts`) — 빌드·발행 자체는 성공한다.
# ⚠️ mac 아이콘(`resources/icons/icon.png`)은 512×512 이상 — 256×256 이면 electron-builder 가 "must be at least 512x512" 로 죽는다.
#    실패를 "예상된 것"으로 적어 두지 마라 — 그 실패는 조사되지 않는다.

# ⚠️ mac 은 아키텍처마다 그 아키텍처의 러너에서 짓는다. 한 러너에서 `--arm64 --x64` 를 함께 뽑으면 두 dmg 에 같은
#    node_modules 가 들어가, `koffi`(`@koromix/koffi-<platform>-<arch>` optionalDependency)가 Intel Mac 에서 제 바이너리를
#    못 찾아 main 이 뜨자마자 죽는다 — 빌드는 초록이다. node-pty 는 전 플랫폼 prebuild 를 담아 괜찮다 — 판단은 패키지마다.

# ⚠️ mac 잡만 재시도(최대 3회)로 감싼다 — dmg 를 다 만든 뒤 `hdiutil: couldn't eject "diskN" - Resource busy` 로 간헐적으로
#    죽는다(electron-builder 의 detach -force 5회 재시도도 소진, 상류 미해결 electron-userland/electron-builder#7137).
#    시도 사이에 붙은 볼륨을 떼고 반쯤 쓰인 dmg 를 지운다 — 남겨 두면 다음 시도가 같은 자리에서 또 막힌다.

name: Release

on:
  push:
    tags:
      - 'v*'
  # 수동 트리거도 허용(태그 없이 테스트 빌드 — draft 로 올라간다).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 올릴 draft 를 먼저 하나 만든다. ⚠️ 없으면 네 빌드 잡이 각자 릴리스를 만든다 — electron-publish `getOrCreateRelease()` 는 목록에서
  # `tag_name === tag || === version` 만 재사용하는데 먼저 온 잡의 draft 는 `untagged-<id>` 다. `tag_name` 을 박은 draft 를 먼저 만들면
  # (목록엔 실린다 — `/releases/tags/<tag>` 는 draft 에 404) 모두 거기 올린다. `release` 잡에서 `needs: prepare` 를 떼지 마라.
  prepare:
    name: 올릴 draft 를 하나 만든다
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - name: draft 준비 (있으면 그대로, 없으면 만들어 태그에 묶는다)
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 수동 트리거는 태그가 없어 draft 를 만들지 않는다 — electron-builder 가 스스로 만든다(테스트 빌드라 갈라져도 무해).
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "태그 푸시가 아니다 — draft 를 미리 만들지 않는다."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # 이미 있으면 그것을 쓴다(재실행 때 늘면 안 된다). draft 는 태그 단건 조회에 안 잡혀 목록에서 찾는다.
          # electron-publish 와 같은 판정식(tag_name 이 태그 또는 버전)이어야 한다 — 갈리면 또 하나가 생긴다.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq "[.[] | select(.draft == true and (.tag_name == \"$TAG\" or .tag_name == \"$VER\"))][0].id")

          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            echo "이미 $TAG 로 묶인 draft 가 있다 (release #$ID) — 그대로 쓴다."
          else
            echo "draft 를 새로 만든다 — tag_name=$TAG"
            # name 은 electron-builder 와 같은 `<version>` — release-notes.mjs · notes 잡이 이름으로도 찾는다.
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f name="$VER" -F draft=true -F prerelease=false \
                   --jq .id)
          fi

          # tag_name 이 안 실렸으면 네 잡이 또 각자 만든다 — 여기서 끊는다.
          BOUND=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .tag_name)
          [ "$BOUND" = "$TAG" ] || { echo "::error::draft #$ID 의 tag_name 이 $BOUND 다 — $TAG 로 묶이지 않았다"; exit 1; }

          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "준비 완료 — release #$ID (tag_name=$BOUND, draft)"

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
            artifact: installer-win-x64
          # mac 은 아키텍처마다 그 러너에서 짓는다(머리말 참고).
          - os: macos-latest        # Apple Silicon (arm64)
            script: release:mac:arm64
            artifact: installer-mac-arm64
          - os: macos-15-intel      # Intel (x64)
            script: release:mac:x64
            artifact: installer-mac-x64
          - os: ubuntu-latest
            script: release:linux
            artifact: installer-linux-x64
    runs-on: ${{ matrix.os }}
    # continue-on-error 를 걸지 않는다 — fail-fast: false 라 mac 이 넘어져도 win/linux 발행은 끝나고 런만 빨갛게 남는다.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rpm 타깃은 러너에 `rpmbuild` 가 있어야 한다(deb 는 기본 탑재) — 없으면 rpm 만이 아니라 잡 전체가 죽는다.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      # win/linux 는 재시도하지 않는다 — 지금까지 실패가 전부 결정적이라 재시도는 시간만 배로 쓴다.
      - name: Build and publish
        if: runner.os != 'macOS'
        run: pnpm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 코드서명 자동 탐색 비활성(미서명 빌드를 실패시키지 않음).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # mac — hdiutil detach 간헐 실패를 재시도로 넘긴다(머리말의 hdiutil 항목 참고).
      - name: Build and publish (macOS — hdiutil 재시도)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          # 코드 서명 슬롯 — 인증서 시크릿이 있으면 서명 + 공증, 없으면 미서명. 미서명 dmg 는 Gatekeeper 가 첫 실행을 막아
          # `xattr -cr` 이 필요하고(실측), 서명이 붙으면 자동 업데이트도 notify-only 에서 무인 설치가 된다.
          # 시크릿: MAC_CSC_LINK(base64 .p12) · MAC_CSC_KEY_PASSWORD · APPLE_ID · APPLE_APP_SPECIFIC_PASSWORD · APPLE_TEAM_ID
          EXTRA=""
          if [ -n "${MAC_CSC_LINK:-}" ]; then
            echo "코드 서명 인증서 감지 — 서명해서 짓는다."
            # 여기서만 electron-builder 가 읽는 이름으로 옮긴다(아래 env 주석 참고).
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            EXTRA="--config.mac.hardenedRuntime=true --config.mac.gatekeeperAssess=false"
            EXTRA="$EXTRA --config.mac.entitlements=build/entitlements.mac.plist"
            EXTRA="$EXTRA --config.mac.entitlementsInherit=build/entitlements.mac.plist"
            if [ -n "${MAC_APPLE_ID:-}" ] && [ -n "${MAC_APPLE_TEAM_ID:-}" ]; then
              echo "공증 자격증명도 있다 — notarize 까지 간다."
              export APPLE_ID="$MAC_APPLE_ID"
              export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="${MAC_APPLE_APP_SPECIFIC_PASSWORD:-}"
              EXTRA="$EXTRA --config.mac.notarize=true"
            else
              echo "::warning::서명은 되지만 공증 자격증명이 없다 — Gatekeeper 가 여전히 막을 수 있다."
            fi
          else
            echo "::warning::mac 인증서 시크릿이 없다 — 미서명으로 짓는다. 사용자는 첫 실행에 xattr -cr 이 필요하다."
          fi
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "--- attempt $i/$attempts — pnpm run ${{ matrix.script }} $EXTRA"
            if pnpm run ${{ matrix.script }} $EXTRA; then
              exit 0
            fi
            if [ "$i" -eq "$attempts" ]; then
              echo "::error::${{ matrix.script }} failed after $attempts attempts"
              exit 1
            fi
            echo "::warning::attempt $i failed — 붙어 있는 디스크 이미지를 떼고 재시도한다"
            # 볼륨 이름은 productName(electron-builder.yml 의 `Vibisual`)으로 시작한다.
            for vol in /Volumes/Vibisual*; do
              [ -d "$vol" ] || continue
              echo "detaching $vol"
              hdiutil detach -force "$vol" || diskutil unmount force "$vol" || true
            done
            rm -f packages/desktop/dist/*.dmg packages/desktop/dist/*.dmg.blockmap || true
            # 붙들고 있던 쪽이 손을 뗄 틈을 준다("should go away soon" — #7137).
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 기본은 미서명 — 위 스크립트가 인증서를 확인하면 true 로 덮는다.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # ⚠️ 서명 값을 electron-builder 가 읽는 이름(CSC_*·APPLE_*)으로 여기 두지 마라 — 없는 시크릿은 빈 문자열로 들어오고
          #    electron-builder 는 `cscLink == null` 로만 걸러 빈 값을 projectDir 경로로 풀어 mac 잡이 `not a file` 로 죽는다.
          #    MAC_ 접두사로 받아 두고 위 스크립트가 비어 있지 않을 때만 CSC_*/APPLE_* 로 export 한다.
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 체크섬 — winget · Homebrew Cask · Flathub 매니페스트의 sha256 공급원이자 받은 설치본 확인 수단(`SHA256SUMS.txt`).
      # 지은 직후에 잰다 — 나중에 재려면 발행 자산을 다시 받아야 해 다운로드 수가 오염된다.
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd packages/desktop/dist
          # macOS 러너에는 `sha256sum` 이 없다 — `shasum -a 256` 이 같은 형식을 낸다.
          sum() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          out="SHA256SUMS-${{ matrix.artifact }}.txt"
          : > "$out"
          shopt -s nullglob
          for f in *-setup.exe *.dmg *.AppImage *.deb *.rpm; do sum "$f" >> "$out"; done
          cat "$out"

      # 체크섬만 따로 올린다 — 설치본과 합치면 `notes` 잡이 700MB 를 받아야 한다.
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.artifact }}
          path: packages/desktop/dist/SHA256SUMS-*.txt
          retention-days: 14
          if-no-files-found: warn

      # 스모크가 검증할 사본은 Actions 아티팩트로 넘긴다 — ⚠️ `gh release download` 로 받으면 그 다운로드가 릴리스 자산
      # 카운터(공개 설치 수)에 잡힌다. 같은 파일이라 검증은 약해지지 않고, 업로드 손상은 electron-updater 가 `latest*.yml` 의
      # sha512 로 설치 직전에 다시 잰다.
      - name: Upload installers for smoke
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # 러너마다 제 OS 산출물만 있어(arm64 러너 `-arm64.dmg`, Intel 은 접미사 없는 `.dmg`) 같은 글롭으로 제 것만 집는다.
          path: |
            packages/desktop/dist/*-setup.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*-mac.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
          # 이미 압축된 설치본이다.
          compression-level: 0
          # 옛 태그를 손으로 검증할 때 만료됐으면 스모크가 릴리스 자산 폴백으로 떨어지고 경고를 남긴다.
          retention-days: 14
          if-no-files-found: warn

  # 릴리스 본문 — electron-builder 는 자산만 올린다. "내 OS 것" 고르는 법(arm64=Apple Silicon, 접미사 없는 dmg=Intel,
  # zip/blockmap/yml 은 받는 것 아님)을 실을 자리는 본문뿐이다.
  # `if: always()` — 한 OS 가 넘어져도 나머지는 발행되므로 본문도 붙는다. 표는 실제 올라간 자산에서 만들어 죽은 링크가 없다.
  notes:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      # ⚠️ draft 에는 태그가 붙지 않는다(`untagged-<id>`, 태그를 먼저 밀어 둬도). 태그로 찾는 뒤 단계 — 스모크의
      #    `gh release download <TAG>`, `check-release-assets.mjs <TAG>`, `gh release edit <TAG> --draft=false`, `release-notes.mjs` —
      #    가 전부 빗나가므로 묶기는 `prepare` 잡이 자산보다 먼저 한다(뒤에 묶으면 이미 갈라졌을 수 있다). 여기서는 하나로 모였는지 잰다.
      - name: 자산이 한 릴리스에 모였는지 확인한다 (갈라졌으면 여기서 끊는다)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # 이번 버전의 draft 를 전부 센다(정상이면 `prepare` 가 묶은 하나). 갈라진 쪽은 태그 없이 `name` 만 버전이라 이름도 본다.
          MATCHES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                      --jq "[.[] | select(.draft == true and (.tag_name == \"$TAG\" or .name == \"$VER\"))]")
          COUNT=$(echo "$MATCHES" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::$TAG 에 해당하는 draft 릴리스가 없다 — 빌드가 전부 실패했을 때 여기로 온다."
            exit 0
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::$TAG 의 draft 가 $COUNT 개다 — 자산이 갈라졌다. prepare 잡이 건너뛰어졌거나 release 잡의 needs 가 떨어졌다."
            echo "$MATCHES" | jq -r '.[] | "  release #\(.id) tag_name=\(.tag_name) name=\(.name) assets=\(.assets|length)"'
            echo "  → 자산을 한쪽으로 합치고 빈 draft 를 지운 뒤 스모크를 다시 돌려야 한다."
            exit 1
          fi

          ID=$(echo "$MATCHES" | jq -r '.[0].id')
          BOUND=$(echo "$MATCHES" | jq -r '.[0].tag_name')
          # 묶이지 않았는데 조용히 지나가면 스모크가 "release not found" 로 죽는다 — 여기서 끊는다.
          [ "$BOUND" = "$TAG" ] || { echo "::error::release #$ID 가 $TAG 로 안 묶여 있다 (tag_name=$BOUND)"; exit 1; }
          echo "확인 — release #$ID 하나에 모였다 (tag_name=$BOUND, assets=$(echo "$MATCHES" | jq '.[0].assets|length'))"

      # 빌드 잡들의 체크섬을 SHA256SUMS.txt 하나로 모아 릴리스 자산으로 올린다(패키지 매니페스트의 sha256 공급원).
      - name: Collect checksums
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: sums
          merge-multiple: true

      - name: Publish SHA256SUMS.txt
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          if ! ls sums/SHA256SUMS-*.txt >/dev/null 2>&1; then
            echo "::warning::체크섬 아티팩트가 없다 — 빌드 잡이 전부 실패했을 때 여기로 온다."
            exit 0
          fi
          # 파일 이름 순으로 모아 두면 판올림이 달라도 diff 가 읽힌다.
          cat sums/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # ⚠️ `gh release upload <TAG>` 를 쓰지 마라 — `/releases/tags/<tag>` 경로라 draft 에 404 다. 릴리스 id 로 올린다.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq "[.[] | select(.draft == true and (.tag_name == \"$TAG\" or .name == \"$VER\"))][0].id")
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::warning::$TAG 의 draft 를 못 찾아 체크섬을 올리지 못했다."
            exit 0
          fi
          # 재실행이면 같은 이름이 이미 있다 — 지우고 올린다(그대로 두면 422).
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" \
                  --jq '.[] | select(.name == "SHA256SUMS.txt") | .id' || true)
          for a in $OLD; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$a" >/dev/null; done
          gh api --method POST -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=SHA256SUMS.txt" \
            --input SHA256SUMS.txt >/dev/null
          echo "SHA256SUMS.txt 를 release #$ID 에 올렸다."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 태그 푸시면 태그의 버전으로, 수동 트리거면 인자 없이(스크립트가 packages/desktop/package.json version 을 읽는다).
      - name: Write download notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/release-notes.mjs --selftest
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node .github/scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" --apply
          else
            node .github/scripts/release-notes.mjs --apply
          fi
