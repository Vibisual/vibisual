# 병합된 PR 사후 감사 — required status check 는 관리자가 우회할 수 있어(`Bypassed rule violations`), 동의 없이 병합된
# 것이 조용히 지나가지 않게 이슈를 연다. 이슈는 기여자의 서면 확인을 받거나 되돌린 뒤에 닫는다.
# ⚠️ pull_request_target(base 권한)을 쓰는 것은 fork PR 의 `pull_request` 토큰이 읽기 전용이라서다 — 그래서 PR 코드를
#    절대 체크아웃·실행하지 않는다. base 의 스크립트만 돌리고 PR 정보는 API 로만 읽는다.

name: Merged PR audit

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  audit:
    name: Consent and sign-off audit
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # base 브랜치를 받는다(기본 동작) — PR 쪽 ref 를 지정하지 마라.
      - uses: actions/checkout@v4

      - name: 판정 로직 자체 검사
        run: |
          set -euo pipefail
          node .github/scripts/pr-license-consent.mjs --selftest
          node .github/scripts/merged-pr-audit.mjs --selftest

      - name: 병합된 PR 감사
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REPORT_PATH: audit-report.md
        run: |
          set -uo pipefail
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            > commits.json
          if node .github/scripts/merged-pr-audit.mjs < commits.json; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 문제가 있으면 이슈를 연다
        if: steps.audit.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TITLE="Licensing: merged #${PR_NUMBER} without recorded consent"

          # 같은 PR 로 이미 열린 이슈가 있으면 또 열지 않는다.
          EXISTING=$(gh issue list --state open --search "in:title \"merged #${PR_NUMBER} without recorded consent\"" \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "이미 이슈 #${EXISTING} 가 열려 있다 — 새로 열지 않는다."
            exit 0
          fi

          gh issue create --title "$TITLE" --body-file audit-report.md
